; WinappDebugInputs.ini (c) hazel ward 2026 
; This file is part of the unit testing infrastructure for winapp2ool, it is used to verify 
; the functionality of the winappdebug module as changes are made to its internals over time
; 
; You should NOT use this file with any cleaning software 
; 
; This file contains ini sections which act as inputs for the testing harness, and contain meta-keys
; which are not part of the winapp2.ini DSL (Flavor, Rule, and ExpectedErrors)
;
; Keys are expected in winapp2.ini order (DetectOS -> LangSecRef -> Section -> SpecialDetect -> Detect -> DetectFile
; -> Default -> Warning -> FileKey -> RegKey -> ExcludeKey 
; Outputs will verified against this ordering, inputs can be provided in any order
;
; When producing a test for a single lintrule, declare it with a Rule key 
; Rules: 
; 0: Casing: Improper casing
; 1: Alphabetization: Improper key value alphabetization
; 2: Numbering: Improper key numbering for numbered keys 
; 3: Parameters: Improper FileKey parameterization 
; 4: Flags: Improper FileKey/ExcludeKey flag formatting 
; 5: Slashes: Use of forward slash (/) or presence of double slashes (\\)
; 6: Defaults: Presence of default keys or true/false enforcement 
; 7: Duplicate Values: Presence of duplicate key values 
; 8: Unneeded numbering: Presence of numbers on keys which should not be numbered 
; 9: Multiples: Presence of multiple or conflicting singleton keys 
; 10: Invalid Values: Presence of invalid key values 
; 11: Syntax Errors: Presence of invalid CCleaner syntax 
; 12: Path Validity: Presence of invalidly defined filesystem or registry locations 
; 13: Semicolons: Improper use of semi colons 
; 14: Optimizations: Experimental merging of parameters for filekeys with the same path and flags
; None: Disable all specific lintrules, test only for unconditionals
; All: Leave all lint rules enabled 
;
; When producing a test which does not yield a testable repair, include an ExpectedErrors key to verify the count
;
; When producing a test for a specific flavor other than the base (Non-CCleaner) flavor, include a Flavor key declaring the appropriate flavor

