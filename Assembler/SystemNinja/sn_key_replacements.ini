; sn_key_replacements.ini (c) 2025-2026 hazel ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Most entries in these files are incomplete and may not function as expected if used on their own
;
; winapp2ool uses this file to apply a System Ninja flavor to winapp2.ini
; This is done to reduce under and over-coverage
; winapp2ool applies this file using Transmute with the Transmute mode set to Replace - ByKey
;
; Corrections are always applied in order:
; section removals -> key name removals -> key value removals -> section replacements
; -> key replacements (this file) -> additions
;
; Any keys defined here will replace entirely keys in the entry of the same name in winapp2.ini
; Only keys of exactly the same name within sections of the exact same name will be replaced
; To replace an entire section, place the replacement data in sn_section_replacements.ini
;
; The [*Map: label] sections replace keys wherever they appear in the base file, matched by
; KeyType and exact Value. System Ninja does not support wildcards in DetectFile, so each rule
; de-abstracts one wildcard DetectFile into its hardcoded variants: Replace1 takes the matched
; key's position and the remaining ReplaceN keys are inserted immediately after it. These rules
; replace the remove + add lockstep formerly split between sn_value_removals.ini and
; sn_additions.ini, and cover new entries carrying the same wildcards automatically

[*Map: Brave DetectFile]
Match=DetectFile=%LocalAppData%\BraveSoftware\Brave-Browser*
Replace1=DetectFile1=%LocalAppData%\BraveSoftware\Brave-Browser
Replace2=DetectFile2=%LocalAppData%\BraveSoftware\Brave-Browser-Beta
Replace3=DetectFile3=%LocalAppData%\BraveSoftware\Brave-Browser-Nightly

[*Map: DuckDuckGo DetectFile]
Match=DetectFile=%LocalAppData%\Packages\*DuckDuckGo*Browser*
Replace1=DetectFile1=%LocalAppData%\Packages\63909DuckDuckGoInc.DuckDuckGoPrivateBrowser_qzdjx70tn762j
Replace2=DetectFile2=%LocalAppData%\Packages\DuckDuckGo.DesktopBrowser_ya2fgkz3nks94

