; sn_value_removals.ini (c) 2025-2026 hazel ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Most entries in these files are incomplete and may not function as expected if used on their own
;
; winapp2ool uses this file to apply a System Ninja flavor to winapp2.ini
; This is done to reduce overcoverage
; Winapp2ool applies this file using Transmute with the Transmute mode set to Remove - ByKey - ByValue
;
; Corrections are always applied in order:
; section removals -> key value removals (this file) -> key name removals -> section replacements
; -> key replacements -> additions
;
; Any keys defined here will be removed entirely from the entry of the same name in winapp2.ini
; Only keys of the same Name (number insensitive) with exactly matching values will be removed
; To remove an entire section instead, add an entry with the same name in sn_section_removals.ini
;
; The [*] section applies to every entry in the base file: any DetectFile key matching one of its
; values is removed wherever it appears. This replaces the per-entry browser cohorts formerly
; maintained here (Brave, DuckDuckGo, Google Chrome, Microsoft Edge, Opera)

[*]
DetectFile=%LocalAppData%\BraveSoftware\Brave-Browser*
DetectFile=%LocalAppData%\Packages\*DuckDuckGo*Browser*
DetectFile=%LocalAppData%\Google\Chrome*
DetectFile=%LocalAppData%\Microsoft\Edge*
DetectFile=%AppData%\Opera Software\Opera*

[Batman: Arkham City *]
DetectFile=%UserProfile%\Documents\WB Games\Batman Arkham City*

[Borderlands *]
DetectFile=%UserProfile%\Documents\My Games\Borderlands*

[Dell Stage Suite *]
DetectFile1=%AppData%\Dell\*Stage
DetectFile2=%LocalAppData%\Dell\*Stage
