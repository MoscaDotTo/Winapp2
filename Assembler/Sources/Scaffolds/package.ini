; package.ini (c) 2026 Hazel Ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Shared scaffold catalog for packaged (Microsoft Store, UWP, and MSIX) applications
; Winapp2ool uses this information to automatically generate FileKeys for applications by scaffold
;
; This file contains one section type:
;
; PackageScaffold
; Defines FileKey patterns applied to entries that declare a Package= key
; Every PackageScaffold section name must have the format [PackageScaffold: Template Name]
;
; PackageScaffold sections support the following keys:
;
; Tier
; Tier=Legacy withholds the scaffold from the "All" flag
; These scaffolds are used only when named
;
; FileKeyBase
; A FileKey template applied to entries that select this scaffold
; One root placeholder is available:
;
; <Package>
; One package folder, %LocalAppData%\Packages\PACKAGE_FOLDER, once per Package= key
;
; An entry that declares Package= also gets one DetectFile per package
; That detection comes from the Package= key itself rather than from this file,
; so PackageScaffolds= never removes it
;
; Default set (used when an entry declares no PackageScaffolds= key):
;   Baseline
;
; An entry that shares its packages with another entry can declare an empty PackageScaffolds=
; so the two do not clean the same folders twice


[PackageScaffold: Baseline]
FileKeyBase=<Package>\AC|*|RECURSE
FileKeyBase=<Package>\Settings|*.log*
FileKeyBase=<Package>\SystemAppData\Helium|*.log*
FileKeyBase=<Package>\TempState|*|REMOVESELF
