[Zoom Languages *]
Section=Language Files
DetectFile=%LocalAppData%\Zoom
Warning=This will delete all languages excluding English.
FileKey1=%LocalAppData%\Zoom\Plugin\Cef_x*\locales|*.pak
ExcludeKey1=PATH|%LocalAppData%\Zoom\Plugin\Cef_x*\locales\|en-*.pak

[ZXT2007 Video Converter Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\ZXT2007 Software\ZXT2007 Video Converter
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\ZXT2007 Software\ZXT2007 Video Converter\Languages|*.isl
ExcludeKey1=FILE|%ProgramFiles%\ZXT2007 Software\ZXT2007 Video Converter\Languages\|English.isl
