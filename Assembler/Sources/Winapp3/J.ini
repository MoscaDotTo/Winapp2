FileKey1=%SystemDrive%|*.$db;*.---;*.?$?;*.??$;*.??~;*.?~?;*.aps;*.blg;*.chk;*.crash;*.diz;*.dmp;*.err;*.ftg;*.fts;*.gid;*.gthr;*.ilk;*.jrs;*.log?;*.ncb;*.nch;*.pch;*.prv;*.sik;*.temp;*.tmp;*.wbk;*.^;*._dd;*._detmp;*._mp;*.___;*.~*;*cache*.txt;*error*.html;*error*.rtf;*error*.txt;*error*.xml;*errorlog*;*fix*.txt*;*log.dat;*log.txt;*report*.xml;*report.txt;*tmp*.dat;*tmp.rtf;chklist.*;log*.txt;mscreate.dir|RECURSE
