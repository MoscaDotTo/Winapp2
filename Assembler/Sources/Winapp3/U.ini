[Ubisoft Game Launcher Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Ubisoft\Ubisoft Game Launcher
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Ubisoft\Ubisoft Game Launcher\locales\*|*.pak|REMOVESELF
ExcludeKey1=PATH|%ProgramFiles%\Ubisoft\Ubisoft Game Launcher\locales\*\|en-*.pak

[Ufasoft SocksChain Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Ufasoft\SocksChain
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Ufasoft\SocksChain|SocksChain_*.chm
FileKey2=%ProgramFiles%\Ufasoft\SocksChain\LNG|*.lng
ExcludeKey1=FILE|%ProgramFiles%\Ufasoft\SocksChain\LNG\|en.lng

[UltraISO Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\UltraISO
Warning=This will delete all languages excluding the default languages.
FileKey1=%ProgramFiles%\UltraISO\lang|lang_*.dll|REMOVESELF

[UmmyVideoDownloader Languages *]
Section=Language Files
DetectFile=%LocalAppData%\UmmyVideoDownloader
Warning=This will delete all languages excluding English.
FileKey1=%LocalAppData%\UmmyVideoDownloader\*\lang|*.po;tips.*
ExcludeKey1=FILE|%LocalAppData%\UmmyVideoDownloader\*\lang\|tips.eng

[UnderCoverXP Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\UnderCoverXP
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\UnderCoverXP\Languages|*.lng
ExcludeKey1=FILE|%ProgramFiles%\UnderCoverXP\Languages\|English.lng

[Uninstall Tool Languages *]
Section=Language Files
Detect=HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\Uninstall Tool_is1
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Uninstall Tool|*.xml|RECURSE
ExcludeKey1=PATH|%ProgramFiles%\Uninstall Tool\|*preferences.xml
ExcludeKey2=PATH|%ProgramFiles%\Uninstall Tool\languages\|*English.xml

[UnityPDF Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\UnityPDF
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\UnityPDF\*|UnityPDF.resources.dll|REMOVESELF
ExcludeKey1=FILE|%ProgramFiles%\UnityPDF\en\|UnityPDF.resources.dll

[Universal Extractor Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Universal Extractor
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Universal Extractor\docs|*|REMOVESELF
FileKey2=%ProgramFiles%\Universal Extractor\lang|*.ini|REMOVESELF

[Universal Viewer Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Universal Viewer
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Universal Viewer\Help|Viewer.*.chm
FileKey2=%ProgramFiles%\Universal Viewer\Language|*.lng
FileKey3=%ProgramFiles%\Universal Viewer\Plugins\ICLView|ReadMe_*.txt
FileKey4=%ProgramFiles%\Universal Viewer\Plugins\ICLView\Language|*.lng
ExcludeKey1=FILE|%ProgramFiles%\Universal Viewer\Help\|Viewer.English.chm
ExcludeKey2=FILE|%ProgramFiles%\Universal Viewer\Language\|English.lng
ExcludeKey3=FILE|%ProgramFiles%\Universal Viewer\Plugins\ICLView\Language\|English.lng

[UpdateStar PasswordFinder Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\UpdateStar\PasswordFinder
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\UpdateStar\PasswordFinder\Lang|*.xml
ExcludeKey1=FILE|%ProgramFiles%\UpdateStar\PasswordFinder\Lang\|English.xml

[USB Port Locked Languages *]
Section=Language Files
Detect=HKCU\Software\LOKIBIT.COM\VSUsbLogon
DetectFile=%ProgramFiles%\VSUsbLogon
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\VSUsbLogon|VSUsbCredProviderRes_*.dll;VSUsbLogonMgrRes_*.dll

[Useful File Utilities Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\UFU
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\UFU|*.lng;*.lng.tip;*.lnm

[uTorrent Languages *]
Section=Language Files
DetectFile=%AppData%\uTorrent
Warning=This will delete all languages excluding English.
FileKey1=%AppData%\uTorrent|utorrent.lng

[uTorrent Web Languages *]
Section=Language Files
DetectFile=%AppData%\uTorrent Web
Warning=This will delete all languages excluding English.
FileKey1=%AppData%\uTorrent Web\localization|*.lang

[Universal Viewer License Text Files *]
Section=Dangerous Applications
DetectFile=%ProgramFiles%\Universal Viewer
FileKey1=%ProgramFiles%\Universal Viewer\3rdParty|*|REMOVESELF
