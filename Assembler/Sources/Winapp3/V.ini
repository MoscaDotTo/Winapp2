[VEGAS Pro Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\VEGAS\VEGAS Pro*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\VEGAS\VEGAS Pro*\de|*|REMOVESELF
FileKey2=%ProgramFiles%\VEGAS\VEGAS Pro*\es|*|REMOVESELF
FileKey3=%ProgramFiles%\VEGAS\VEGAS Pro*\fr|*|REMOVESELF
FileKey4=%ProgramFiles%\VEGAS\VEGAS Pro*\Language|local_*.cfg
FileKey5=%ProgramFiles%\VEGAS\VEGAS Pro*\OFX Video Plug-Ins\*.bundle\Contents\Presets|*-*.xml
FileKey6=%ProgramFiles%\VEGAS\VEGAS Pro*\OFX Video Plug-Ins\*.bundle\Contents\Resources|*-*.xml
FileKey7=%ProgramFiles%\VEGAS\VEGAS Pro*\Online|MagixOFA-*.dll
FileKey8=%ProgramFiles%\VEGAS\VEGAS Pro*\Protein\Forms|UnlockForm*_*.rtf
FileKey9=%ProgramFiles%\VEGAS\VEGAS Pro*\Protein\Resource|UnlockDialog_*.ini;WhyUnlock_*.htm
ExcludeKey1=FILE|%ProgramFiles%\VEGAS\VEGAS Pro*\Language\|local_en_US.cfg
ExcludeKey2=FILE|%ProgramFiles%\VEGAS\VEGAS Pro*\Online\|MagixOFA-en.dll
ExcludeKey3=FILE|%ProgramFiles%\VEGAS\VEGAS Pro*\Protein\Resource\|UnlockDialog_common.ini
ExcludeKey4=FILE|%ProgramFiles%\VEGAS\VEGAS Pro*\Protein\Resource\|UnlockDialog_EN.ini
ExcludeKey5=FILE|%ProgramFiles%\VEGAS\VEGAS Pro*\Protein\Resource\|WhyUnlock_EN.htm
ExcludeKey6=PATH|%ProgramFiles%\VEGAS\VEGAS Pro*\Protein\Forms\|UnlockForm*_en_*.rtf

