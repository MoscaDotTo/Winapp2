[BackgammonMasters Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\BackgammonMasters
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\BackgammonMasters|*_1.dll
ExcludeKey1=FILE|%ProgramFiles%\BackgammonMasters\|english_1.dll

[Background_Fault Languages *]
Section=Language Files
DetectFile=%LocalAppData%\Background_Fault
Warning=This will delete all languages excluding English.
FileKey1=%LocalAppData%\Background_Fault\locales|*.pak
ExcludeKey1=PATH|%LocalAppData%\Background_Fault\locales\|en-*.pak

