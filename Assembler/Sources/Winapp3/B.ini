ExcludeKey2=FILE|%ProgramFiles%\Webteh\BSPlayer\lang\|English.lng
ExcludeKey3=PATH|%AppData%\BSplayer\AC3 Filter\doc\|*_eng.pdf

[Backup Files *]
Section=Dangerous Long
Detect=HKLM\Software\Microsoft
Warning=After using this, you may not be able to use some softwares recovery/restore abilities.
FileKey1=%SystemDrive%|*.abf;*.abk;*.asd;*.ate;*.ati;*.bak*;*.bck;*.bcm;*.bdb;*.bkf;*.bkp;*.cbk;*.crds;*.da0;*.fbk;*.ful;*.mbf;*.mig;*.old;*.onepkg;*.ori;*.qic;*.rbf;*.sbb;*.trn;*.vpcbackup;*.wbcat;*.wbk;*.xlk|RECURSE

[Background Activity Moderator *]
Section=Dangerous Windows
Detect=HKLM\System\CurrentControlSet\Services\bam
RegKey1=HKLM\System\CurrentControlSet\Services\bam\State\UserSettings
RegKey2=HKLM\System\CurrentControlSet\Services\bam\UserSettings

[Bandicam Output *]
Section=Dangerous Multimedia
Detect=HKCU\Software\BANDISOFT\BANDICAM
Warning=This will delete the contents of your output folder.
FileKey1=%Documents%\Bandicam|*|RECURSE

[Bandizip License Text Files *]
Section=Dangerous Utilities
DetectFile=%ProgramFiles%\Bandizip
FileKey1=%ProgramFiles%\Bandizip\data|ArkLicense.txt;EULA.rtf;local.html

[BleachBit Console Removal *]
Section=Dangerous Utilities
Detect=HKCU\Software\BleachBit
Warning=This removes the debugger for BleachBit. Don't use if you need it.
FileKey1=%ProgramFiles%\BleachBit|bleachbit_console.exe

[BlueStacks SharedFolder *]
Section=Dangerous Applications
Detect1=HKCU\Software\BlueStacks
Detect2=HKLM\Software\BlueStacks
FileKey1=%ProgramData%\BlueStacks\UserData\SharedFolder|*

[Brave Indexed Database Extended *]
Section=Dangerous Brave
Detect=HKCU\Software\BraveSoftware
Warning=This may cause some extensions to not work as intended.
FileKey1=%LocalAppData%\BraveSoftware\Brave-Browser*\User Data\*\IndexedDB|*|RECURSE

[Brave Installer *]
Section=Dangerous Brave
Detect=HKCU\Software\BraveSoftware
Warning=This will prevent successful online updates. You will need to download the installer for a reinstallation.
FileKey1=%ProgramFiles%\BraveSoftware\Brave-Browser*\Application\*\Installer|*.7z

[Brave License Text Files *]
Section=Dangerous Brave
Detect=HKCU\Software\BraveSoftware
FileKey1=%LocalAppData%\BraveSoftware\Brave-Browser*\User Data|*LICENSE.txt;CHANGELOG;CHANGELOG.md;credits;LICENSE;LICENSE.md;UNLICENSE|RECURSE

[Brave Local Storage Extended *]
Section=Dangerous Brave
Detect=HKCU\Software\BraveSoftware
Warning=This may cause some extensions to not work as intended.
FileKey1=%LocalAppData%\BraveSoftware\Brave-Browser*\User Data\*\Local Storage\leveldb|*

[Brawlhalla Replays *]
Section=Dangerous Games
DetectFile=%UserProfile%\BrawlhallaReplays
Warning=You will delete your saved replays.
FileKey1=%UserProfile%\BrawlhallaReplays|*.replay|REMOVESELF
