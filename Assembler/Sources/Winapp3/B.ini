ExcludeKey1=FILE|%ProgramFiles%\BraveSoftware\Brave-Browser\Application\*\resources\brave_extension\_locales\en_*\|messages.json
ExcludeKey2=FILE|%ProgramFiles%\BraveSoftware\Brave-Browser\Application\*\resources\brave_rewards\_locales\en_*\|messages.json
ExcludeKey3=PATH|%ProgramFiles%\BraveSoftware\Brave-Browser\Application\*\Locales\|en-*.pak
