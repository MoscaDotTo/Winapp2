[BSPlayer Languages *]
Section=Language Files
DetectFile1=%ProgramFiles%\BSplayerPro
DetectFile2=%ProgramFiles%\Webteh\BSPlayer
Warning=This will delete all languages excluding English.
FileKey1=%AppData%\BSplayer\AC3 Filter\doc|*.pdf
FileKey2=%AppData%\BSplayer\AC3 Filter\lang|*.po
FileKey3=%AppData%\BSplayer\AC3 Filter\lang\*\LC_MESSAGES|ac3filter.mo
FileKey4=%ProgramFiles%\BSplayerPro\lang|*.lng
FileKey5=%ProgramFiles%\Webteh\BSPlayer\lang|*.lng
