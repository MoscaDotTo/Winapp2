[LanTricks LanWhoIs Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\LanTricks\LanWhoIs
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\LanTricks\LanWhoIs|*.lng;readme_*.txt
ExcludeKey1=FILE|%ProgramFiles%\LanTricks\LanWhoIs\|english.lng

[LastPass Languages *]
Section=Language Files
DetectFile=%UserProfile%\AppData\LocalLow\LastPass
Warning=This will delete all languages excluding English.
FileKey1=%UserProfile%\AppData\LocalLow\LastPass\lang|*.dat;*.dat.inuse
ExcludeKey1=PATH|%UserProfile%\AppData\LocalLow\LastPass\lang\|en-*.dat
ExcludeKey2=PATH|%UserProfile%\AppData\LocalLow\LastPass\lang\|en-*.dat.inuse

