[YACReader Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\YACReader
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\YACReader\languages|yacreader*.qm
FileKey2=%ProgramFiles%\YACReader\translations|qt_*.qm
ExcludeKey1=FILE|%ProgramFiles%\YACReader\translations\|qt_en.qm

[YouTube to MP3 Converter Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\YouTube to MP3 Converter
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\YouTube to MP3 Converter|YouTubeToMP3.*.qm
ExcludeKey1=FILE|%ProgramFiles%\YouTube to MP3 Converter\|YouTubeToMP3.en.qm

[YTD Video Downloader Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\GreenTree Applications\YTD Video Downloader
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\GreenTree Applications\YTD Video Downloader\Lang|res*.ini
ExcludeKey1=FILE|%ProgramFiles%\GreenTree Applications\YTD Video Downloader\Lang\|res1033.ini
