[TagScanner Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\TagScanner
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\TagScanner\lang|*.lng
ExcludeKey1=FILE|%ProgramFiles%\TagScanner\lang\|English.lng

