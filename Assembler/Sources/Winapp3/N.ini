[Nero Burning ROM Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Nero\Nero*
Warning=This will delete all languages excluding English.
FileKey1=%CommonProgramFiles%\Nero\AdvrCntr*|Eula_*.rtf
FileKey2=%CommonProgramFiles%\Nero\Nero BackItUp*|NBRes-*.nls
FileKey3=%ProgramData%\Nero\Nero*\OnlineServices\PushMarketingFeeds|offline-*.xml
FileKey4=%ProgramFiles%\Nero\Nero Common\AdvrCntr*|Eula_Nero_*.rtf
FileKey5=%ProgramFiles%\Nero\Nero*\Nero Burning ROM|BCGCBProRes_*-*.nls;Nero_*-*.nls;Nero_*-*.xml
FileKey6=%ProgramFiles%\Nero\Nero*\Nero Burning ROM\CoverEdCtrl|CoverDes_*-*.nls
FileKey7=%ProgramFiles%\Nero\Nero*\Nero Burning ROM\ShellRes\*|shellres.dll.mui|REMOVESELF
FileKey8=%ProgramFiles%\Nero\Nero*\Nero BurnLite|NSSModelResources_*.nls;StartSmart_*.nls
FileKey9=%ProgramFiles%\Nero\Nero*\Nero BurnLite\html|nss_kc_*.html
FileKey10=%ProgramFiles%\Nero\Nero*\Nero BurnLite\NeroAPIFiles|Nero_*.xml
ExcludeKey1=FILE|%ProgramData%\Nero\Nero*\OnlineServices\PushMarketingFeeds\|offline-ENG.xml
ExcludeKey2=FILE|%ProgramFiles%\Nero\Nero*\Nero Burning ROM\ShellRes\en-*\|shellres.dll.mui
ExcludeKey3=FILE|%ProgramFiles%\Nero\Nero*\Nero BurnLite\NeroAPIFiles\|nero_dev.xml
ExcludeKey4=PATH|%CommonProgramFiles%\Nero\AdvrCntr*\|Eula_*_ENG.rtf
ExcludeKey5=PATH|%CommonProgramFiles%\Nero\AdvrCntr*\|Eula_Nero_en-*.rtf
ExcludeKey6=PATH|%ProgramFiles%\Nero\Nero Common\AdvrCntr*\|Eula_Nero_en-*.rtf
ExcludeKey7=PATH|%ProgramFiles%\Nero\Nero*\Nero Burning ROM\|BCGCBProRes_en-*.nls
ExcludeKey8=PATH|%ProgramFiles%\Nero\Nero*\Nero Burning ROM\|Nero_en-*.nls
ExcludeKey9=PATH|%ProgramFiles%\Nero\Nero*\Nero Burning ROM\|Nero_en-*.xml
ExcludeKey10=PATH|%ProgramFiles%\Nero\Nero*\Nero Burning ROM\CoverEdCtrl\|CoverDes_en-*.nls
ExcludeKey11=PATH|%ProgramFiles%\Nero\Nero*\Nero BurnLite\|NSSModelResources_en-*.nls
ExcludeKey12=PATH|%ProgramFiles%\Nero\Nero*\Nero BurnLite\|StartSmart_en-*.nls
