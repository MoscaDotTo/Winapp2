[Samsung Kies Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Samsung\Kies
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Samsung\Kies\External\FirmwareUpdate\language|Resource_*.dll
FileKey2=%ProgramFiles%\Samsung\Kies\Locale\*|Kies.Locale.resources.dll|REMOVESELF
FileKey3=%ProgramFiles%\Samsung\Kies\locales|*.pak
FileKey4=%ProgramFiles%\Samsung\Kies\Updater\*|Kies.Update.resources.dll|REMOVESELF
ExcludeKey1=FILE|%ProgramFiles%\Samsung\Kies\Locale\en-*\|Kies.Locale.resources.dll
