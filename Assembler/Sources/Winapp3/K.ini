[Kodi Languages *]
Section=Language Files
DetectFile=%AppData%\kodi*
Warning=This will delete all languages excluding English.
FileKey1=%AppData%\kodi*\addons\metadata.*\resources\language\*|strings.po|REMOVESELF
FileKey2=%AppData%\kodi*\addons\plugin.*\resources\language\*|strings.po;strings.xml|REMOVESELF
FileKey3=%AppData%\kodi*\addons\script.*\resources\language\*|strings.po;strings.xml|REMOVESELF
FileKey4=%AppData%\kodi*\addons\service.*\resources\language\*|strings.po|REMOVESELF
ExcludeKey1=FILE|%AppData%\kodi*\addons\metadata.*\resources\language\english*\|strings.po
ExcludeKey2=FILE|%AppData%\kodi*\addons\plugin.*\resources\language\english*\|strings.po
ExcludeKey3=FILE|%AppData%\kodi*\addons\plugin.*\resources\language\english*\|strings.xml
ExcludeKey4=FILE|%AppData%\kodi*\addons\script.*\resources\language\english*\|strings.po
ExcludeKey5=FILE|%AppData%\kodi*\addons\script.*\resources\language\english*\|strings.xml
ExcludeKey6=FILE|%AppData%\kodi*\addons\service.*\resources\language\english*\|strings.po

[KuaiZip Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\KuaiZip
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\KuaiZip\lang|*_Lang.dll
ExcludeKey1=FILE|%ProgramFiles%\KuaiZip\lang\|Enu_Lang.dll

[Kerish Doctor License Text Files *]
Section=Dangerous Utilities
DetectFile=%ProgramFiles%\Kerish Doctor
FileKey1=%ProgramFiles%\Kerish Doctor\EULA|*.txt|REMOVESELF

[Kodi License Text Files *]
Section=Dangerous Multimedia
DetectFile=%AppData%\kodi*
FileKey1=%AppData%\kodi*\addons|*licensing.txt;*_notice.txt;AUTHORS.rst;AUTHORS.txt;ChangeLog;Changelog*.txt;CHANGES;CHANGES.rst;CODE_OF_CONDUCT.md;CONTRIBUTING.md;CONTRIBUTORS.txt;COPYING;credits.txt;HISTORY.md;HISTORY.rst;LICENSE;LICENSE.flashmedia;LICENSE.pbs;License.txt;NEWS;NOTES.rst;TODO|RECURSE
