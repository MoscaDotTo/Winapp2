[K-Lite Codec Pack Languages *]
Section=Language Files
Detect=HKLM\Software\KLCodecPack
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\K-Lite Codec Pack\Filters\ffdshow*\Languages|ffdshow.*
FileKey2=%ProgramFiles%\K-Lite Codec Pack\Icaros\Resources\Localize|Config.*.po
ExcludeKey1=FILE|%ProgramFiles%\K-Lite Codec Pack\Filters\ffdshow*\Languages\|ffdshow.1033.en

[K-Lite Media Player Classic Languages *]
Section=Language Files
Detect=HKLM\Software\Classes\Applications\mpc-hc.exe
Warning=This will delete all languages excluding the default language.
FileKey1=%ProgramFiles%\K-Lite Codec Pack\MPC-HC*\Lang|mpcresources.*.dll
ExcludeKey1=PATH|%ProgramFiles%\K-Lite Codec Pack\MPC-HC*\Lang\|mpcresources.en_*.dll

[Kalkules Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Kalkules
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Kalkules\const|const-*.dat
FileKey2=%ProgramFiles%\Kalkules\lang|*.txt
ExcludeKey1=FILE|%ProgramFiles%\Kalkules\const\|const-en.dat
ExcludeKey2=FILE|%ProgramFiles%\Kalkules\lang\|english.txt

[Kamo Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Kamo
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Kamo\locales|*.pak
FileKey2=%ProgramFiles%\Kamo\nitroresources|Locale-*.json
ExcludeKey1=FILE|%ProgramFiles%\Kamo\nitroresources\|Locale-en.json
ExcludeKey2=PATH|%ProgramFiles%\Kamo\locales\|en-*.pak

[Kaseto Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Kaseto
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Kaseto\Languages|*.ini
ExcludeKey1=FILE|%ProgramFiles%\Kaseto\Languages\|en.ini

[Kaspersky Password Manager Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\*|*.ini;*.lt;rebranding.json;vectorgraphics.style|REMOVESELF
ExcludeKey1=FILE|%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\en\dictionaries\kpm\|vectorgraphics.style
ExcludeKey2=FILE|%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\en\rebranding\|rebranding.json
ExcludeKey3=PATH|%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\en\locs\|*.ini
ExcludeKey4=PATH|%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\en\locs\|*.lt
ExcludeKey5=PATH|%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\neutral\locs\|*.ini
ExcludeKey6=PATH|%ProgramFiles%\Kaspersky Lab\Kaspersky Password Manager*\resources\neutral\locs\|*.lt

[Kerish Doctor Languages *]
Section=Language Files
DetectFile=%ProgramData%\Kerish Products\Kerish Doctor
Warning=This will delete all languages excluding English.
FileKey1=%ProgramData%\Kerish Products\Kerish Doctor\Help|*.chm
FileKey2=%ProgramData%\Kerish Products\Kerish Doctor\Locale|*.lng
FileKey3=%ProgramData%\Kerish Products\Kerish Doctor\Resources\*|*.png;*.wav|REMOVESELF
FileKey4=%ProgramFiles%\Kerish Doctor\Help|*.chm
ExcludeKey1=FILE|%ProgramData%\Kerish Products\Kerish Doctor\Help\|English.chm
ExcludeKey2=FILE|%ProgramData%\Kerish Products\Kerish Doctor\Locale\|English.lng
ExcludeKey3=FILE|%ProgramFiles%\Kerish Doctor\Help\|English.chm
ExcludeKey4=PATH|%ProgramData%\Kerish Products\Kerish Doctor\Resources\English\|*.png
ExcludeKey5=PATH|%ProgramData%\Kerish Products\Kerish Doctor\Resources\English\|*.wav

[Keynote Languages *]
Section=Language Files
Detect=HKCU\Software\Code|Aero Technologies\Keynote
DetectFile=%ProgramFiles%\Password Memory*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Password Memory*\language|*.dat
ExcludeKey1=FILE|%ProgramFiles%\Password Memory*\language\|english.dat

[KidLogger Languages *]
