[Hard Disk Sentinel Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Hard Disk Sentinel
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Hard Disk Sentinel|*.chm;*.lng
ExcludeKey1=FILE|%ProgramFiles%\Hard Disk Sentinel\|en.chm
ExcludeKey2=PATH|%ProgramFiles%\Hard Disk Sentinel\|en*.lng

[Hekasoft Backup & Restore Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Hekasoft Backup & Restore
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Hekasoft Backup & Restore\lang|*.xml
ExcludeKey1=FILE|%ProgramFiles%\Hekasoft Backup & Restore\lang\|eng.xml

[Hetman Data Recovery Pack Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Hetman Software\Hetman Data Recovery Pack
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Hetman Software\Hetman Data Recovery Pack\*\Language|*.lng|RECURSE
ExcludeKey1=FILE|%ProgramFiles%\Hetman Software\Hetman Data Recovery Pack\*\Language\|English.lng
ExcludeKey2=FILE|%ProgramFiles%\Hetman Software\Hetman Data Recovery Pack\*\Language\common\|English.lng

[Hetman File Repair Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Hetman Software\Hetman File Repair
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Hetman Software\Hetman File Repair\languages|*.chm;*.htm;*.xml
ExcludeKey1=FILE|%ProgramFiles%\Hetman Software\Hetman File Repair\languages\|english_products.htm
ExcludeKey2=PATH|%ProgramFiles%\Hetman Software\Hetman File Repair\languages\|english_*.chm
ExcludeKey3=PATH|%ProgramFiles%\Hetman Software\Hetman File Repair\languages\|english_*.xml

[HideMyAss! Pro VPN Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\HMA VPN
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\HMA VPN\locales|*.pak
ExcludeKey1=PATH|%ProgramFiles%\HMA VPN\locales\|en-*.pak

[HiView Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\HiView
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\HiView|*.ini
ExcludeKey1=FILE|%ProgramFiles%\HiView\|English.ini

[Honeyview Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Honeyview
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Honeyview\langs|*.ini
ExcludeKey1=FILE|%ProgramFiles%\Honeyview\langs\|English.ini

[HotVirtualKeyboard Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\HotVirtualKeyboard
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\HotVirtualKeyboard\Common|*.common
FileKey2=%ProgramFiles%\HotVirtualKeyboard\Lang|*.txt
ExcludeKey1=FILE|%ProgramFiles%\HotVirtualKeyboard\Common\|en.common
ExcludeKey2=FILE|%ProgramFiles%\HotVirtualKeyboard\Lang\|en.txt

[HP Languages *]
Section=Language Files
DetectFile1=%ProgramData%\HP\HP*
DetectFile2=%ProgramFiles%\HP\HP*
DetectFile3=%SystemDrive%\HP
Warning=This will delete all languages excluding English.
FileKey1=%ProgramData%\HP\HP*\HPUDC\MoreInfo|*.htm
FileKey2=%ProgramData%\HP\HP*\Installer\Help|HP_Setup_Help.chm|REMOVESELF
FileKey3=%ProgramFiles%\HP\HP*\Bin\UDC_Files|localize_*.json
FileKey4=%ProgramFiles%\HP\HP*\Bin\UDC_Files\OfflineStatement|*.htm
FileKey5=%ProgramFiles%\HP\HP*\data\chms|*.chm
FileKey6=%ProgramFiles%\HP\HP*\data\ini|*.ini
FileKey7=%SystemDrive%\HP\Diagnostics\PSDR\help|*.chm|REMOVESELF
FileKey8=%SystemDrive%\HP\Diagnostics\PSDR\Strings|*.xaml
ExcludeKey1=FILE|%ProgramData%\HP\HP*\HPUDC\MoreInfo\|1033.htm
ExcludeKey2=FILE|%ProgramData%\HP\HP*\Installer\Help\1033\|HP_Setup_Help.chm
ExcludeKey3=FILE|%ProgramFiles%\HP\HP*\Bin\UDC_Files\|localize_1033.json
ExcludeKey4=FILE|%ProgramFiles%\HP\HP*\Bin\UDC_Files\OfflineStatement\|1033.htm
ExcludeKey5=FILE|%SystemDrive%\HP\Diagnostics\PSDR\Strings\|1033.xaml
ExcludeKey6=PATH|%ProgramFiles%\HP\HP*\data\chms\|*-1033.chm
ExcludeKey7=PATH|%ProgramFiles%\HP\HP*\data\ini\|*-1033.ini
ExcludeKey8=PATH|%SystemDrive%\HP\Diagnostics\PSDR\help\1033\|*.chm

[Hedgewars Saves *]
Section=Dangerous Games
Detect=HKLM\Software\Hedgewars
FileKey1=%Documents%\Hedgewars\Saves|*

[Hedgewars Videos *]
Section=Dangerous Games
Detect=HKLM\Software\Hedgewars
FileKey1=%Documents%\Hedgewars\Videos|*
