[X-NetStat Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\X-NetStat
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\X-NetStat\*|*.dll|REMOVESELF
ExcludeKey1=PATH|%ProgramFiles%\X-NetStat\runtimes\win-*\native\|*.dll

[xampp Languages *]
Section=Language Files
DetectFile=%SystemDrive%\xampp
Warning=This will delete all languages excluding English.
FileKey1=%SystemDrive%\xampp\locale|*.*po;*.mo|RECURSE
ExcludeKey1=PATH|%SystemDrive%\xampp\locale\en\LC_MESSAGES\|*.mo
ExcludeKey2=PATH|%SystemDrive%\xampp\locale\en\LC_MESSAGES\|*po

[Xecutor Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Xecutor
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Xecutor|Xecutor.*.lng
ExcludeKey1=FILE|%ProgramFiles%\Xecutor\|Xecutor.en.lng

[XMedia Recode Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\XMedia Recode
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\XMedia Recode\Lang|*.lang
ExcludeKey1=FILE|%ProgramFiles%\XMedia Recode\Lang\|english.lang

[Xplorer2 Languages *]
Section=Language Files
Detect=HKCU\Software\ZabaraKatranemia Plc\xplorer2
DetectFile=%ProgramFiles%\zabkat\xplorer2*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\zabkat\xplorer2*|x2t_*.dll

[xSharez Scanner 3 Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\xSharez Scanner 3
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\xSharez Scanner 3\languages|*
ExcludeKey1=FILE|%ProgramFiles%\xSharez Scanner 3\languages\|English

[XSplit Broadcaster Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\SplitmediaLabs\XSplit Broadcaster
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\SplitmediaLabs\XSplit Broadcaster\x*\cef*_*\locales|*.pak
FileKey2=%ProgramFiles%\SplitmediaLabs\XSplit Broadcaster\x*\res|*.lang.json
ExcludeKey1=PATH|%ProgramFiles%\SplitmediaLabs\XSplit Broadcaster\x*\cef*_*\locales\|en-*.pak
ExcludeKey2=PATH|%ProgramFiles%\SplitmediaLabs\XSplit Broadcaster\x*\res\|*.en.lang.json

