[EA Sports FIFA Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Origin Games\FIFA*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Origin Games\FIFA*\FIFASetup\*|fifaconfig.resources.dll|REMOVESELF

