[qBittorrent Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\qBittorrent
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\qBittorrent\translations|*.qm

[QIP Infium Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\QIP Infium
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\QIP Infium\Langs|*.dll
ExcludeKey1=FILE|%ProgramFiles%\QIP Infium\Langs\|English.dll

[Qiqqa Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Qiqqa
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Qiqqa\licenses|*|REMOVESELF
FileKey2=%ProgramFiles%\Qiqqa\Localisation|*.qiqqa.txt
ExcludeKey1=FILE|%ProgramFiles%\Qiqqa\Localisation\|en.qiqqa.txt

[Qmmp Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Qt-based Multimedia Player
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Qt-based Multimedia Player\translations|qtbase_*.qm
ExcludeKey1=FILE|%ProgramFiles%\Qt-based Multimedia Player\translations\|qtbase_en.qm

[QTranslate Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\QTranslate
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\QTranslate\Locales\*|help.txt;lang.json|REMOVESELF
ExcludeKey1=FILE|%ProgramFiles%\QTranslate\Locales\English\|help.txt
ExcludeKey2=FILE|%ProgramFiles%\QTranslate\Locales\English\|lang.json

[Qiqqa Local Library *]
Section=Dangerous Applications
DetectFile=%LocalAppData%\Quantisle\Qiqqa
FileKey1=%LocalAppData%\Quantisle\Qiqqa\Guest|Qiqqa.library;Qiqqa.recently_read
FileKey2=%LocalAppData%\Quantisle\Qiqqa\Guest\documents|*|RECURSE
FileKey3=%LocalAppData%\Quantisle\Qiqqa\Guest\index|*|RECURSE
FileKey4=%LocalAppData%\Quantisle\Qiqqa\ocr|*|RECURSE

[Quick Launch *]
Section=Dangerous Windows
Detect=HKCU\Software\Microsoft\Internet Explorer
Warning=This will remove all of your Quick Launch icons.
FileKey1=%AppData%\Microsoft\Internet Explorer\Quick Launch|*.lnk

[Quick Launch ImplicitAppShortcuts *]
Section=Dangerous Windows
Detect=HKCU\Software\Microsoft\Internet Explorer
Warning=This will break pinned configuration shortcuts, like control panel.
FileKey1=%AppData%\Microsoft\Internet Explorer\Quick Launch\User Pinned\ImplicitAppShortcuts|*|RECURSE
