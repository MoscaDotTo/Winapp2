[.NET Core SDK Uninstall Tool Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\dotnet-core-uninstall
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\dotnet-core-uninstall\*|dotnet-core-uninstall.resources.dll|REMOVESELF

[.NET Desktop Runtime Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\dotnet
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\dotnet\shared\Microsoft.WindowsDesktop.App\*\*|*.resources.dll|REMOVESELF

[3B Software Registry Repair Pro Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\3B Software\Registry Repair Pro
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\3B Software\Registry Repair Pro|*.lang
ExcludeKey1=FILE|%ProgramFiles%\3B Software\Registry Repair Pro\|English.lang

[4K Slideshow Maker Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\4K Slideshow Maker
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\4K Slideshow Maker\translation|*.qm
ExcludeKey1=PATH|%ProgramFiles%\4K Slideshow Maker\translation\|*_en.qm

[4K Video Downloader Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\4KDownload\4kvideodownloader
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\4KDownload\4kvideodownloader\translation|*.qm
ExcludeKey1=PATH|%ProgramFiles%\4KDownload\4kvideodownloader\translation\|*_en.qm

[4K YouTube to MP3 Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\4KDownload\4kyoutubetomp3
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\4KDownload\4kyoutubetomp3\translation|*.qm
ExcludeKey1=PATH|%ProgramFiles%\4KDownload\4kyoutubetomp3\translation\|*_en.qm

[7-Zip Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\7-zip
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\7-Zip\Lang|*
ExcludeKey1=FILE|%ProgramFiles%\7-Zip\Lang\|en.ttt

[7-Zip SFX Maker Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\7-ZIP SFX Maker
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\7-ZIP SFX Maker\language|*.txt
ExcludeKey1=FILE|%ProgramFiles%\7-ZIP SFX Maker\language\|English.txt

[7+ Taskbar Tweaker Languages *]
Section=Language Files
DetectFile=%LocalAppData%\Programs\7+ Taskbar Tweaker
Warning=This will delete all Help files excluding English.
FileKey1=%LocalAppData%\Programs\7+ Taskbar Tweaker\help|*.chm
FileKey2=%LocalAppData%\Programs\7+ Taskbar Tweaker\help\images\*|*.png|REMOVESELF
ExcludeKey1=PATH|%LocalAppData%\Programs\7+ Taskbar Tweaker\help\|en-*.chm

[7GIF Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\7GIF
Warning=This will delete all Help files excluding English.
FileKey1=%ProgramFiles%\7GIF\Languages|*.lng|REMOVESELF

[8GadgetPack Languages *]
Section=Language Files
Detect=HKCU\Software\8GadgetPack
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Windows Sidebar\*|*|REMOVESELF
ExcludeKey1=PATH|%ProgramFiles%\Windows Sidebar\8GadgetPack\|*
ExcludeKey2=PATH|%ProgramFiles%\Windows Sidebar\en-us\|*
ExcludeKey3=PATH|%ProgramFiles%\Windows Sidebar\Gadgets\|*
ExcludeKey4=PATH|%ProgramFiles%\Windows Sidebar\Shared Gadgets\|*

[9-lab Removal Tool Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\9-lab\Removal Tool
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\9-lab\Removal Tool\Languages|*.lng
ExcludeKey1=FILE|%ProgramFiles%\9-lab\Removal Tool\Languages\|english.lng

[3DMark Saved Benchmarks *]
Section=Dangerous Games
DetectFile=%Documents%\3DMark
FileKey1=%Documents%\3DMark|*.3dmark-result
