[RadarSync PC Updater Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\RadarSync
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\RadarSync|*_rcp.ini
ExcludeKey1=FILE|%ProgramFiles%\RadarSync\|eng_rcp.ini

