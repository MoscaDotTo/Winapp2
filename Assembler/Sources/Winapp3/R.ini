[Registry Leftovers *]
Section=Dangerous Windows
Detect1=HKCU\Software\AI_RecycleBin
Detect2=HKCU\Software\undefined
Detect3=HKCU\Software\VB and VBA Program Settings\Temp
Detect4=HKCU\Sofware
Detect5=HKLM\Software\PortableAppRegistryTest
