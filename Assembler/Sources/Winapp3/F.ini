[ffdshow Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\ffdshow*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\ffdshow*\Languages|ffdshow.*
ExcludeKey1=FILE|%ProgramFiles%\ffdshow*\Languages\|ffdshow.1033.en

