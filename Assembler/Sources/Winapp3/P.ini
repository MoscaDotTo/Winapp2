[P2Pover Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\P2Pover
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\P2Pover\lang\*|*|REMOVESELF
ExcludeKey1=PATH|%ProgramFiles%\P2Pover\lang\eng\|*

