[OBS Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\obs-studio
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\obs-studio\data\obs-plugins\*\locale|*.ini
FileKey2=%ProgramFiles%\obs-studio\obs-plugins\64bit\locales|*.pak
ExcludeKey1=FILE|%ProgramFiles%\obs-studio\data\obs-plugins\*\locale\|en-US.ini
ExcludeKey2=PATH|%ProgramFiles%\obs-studio\obs-plugins\64bit\locales\|en-*.pak

[Office Password Recovery Toolbox Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Office Password Recovery Toolbox
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Office Password Recovery Toolbox\Languages|*.lng
ExcludeKey1=FILE|%ProgramFiles%\Office Password Recovery Toolbox\Languages\|English.lng

[Okular Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Okular
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Okular\bin\data\kf5\licenses|*|REMOVESELF
FileKey2=%ProgramFiles%\Okular\bin\data\locale\*|*.desktop;*.mo;*.pmap*;*.qm;ki18n5.js|REMOVESELF
FileKey3=%ProgramFiles%\Okular\share\locale\*|*.mo|REMOVESELF
FileKey4=%ProgramFiles%\Okular\share\osi\*|*.xml|REMOVESELF
FileKey5=%ProgramFiles%\Okular\translations|*.qm
ExcludeKey1=FILE|%ProgramFiles%\Okular\bin\data\locale\en*\LC_SCRIPTS\ki18n5\|ki18n5.js
ExcludeKey2=PATH|%ProgramFiles%\Okular\bin\data\locale\en*\|*.desktop
ExcludeKey3=PATH|%ProgramFiles%\Okular\bin\data\locale\en*\LC_MESSAGES\|*.mo
ExcludeKey4=PATH|%ProgramFiles%\Okular\bin\data\locale\en*\LC_MESSAGES\|*.qm
ExcludeKey5=PATH|%ProgramFiles%\Okular\bin\data\locale\en*\LC_SCRIPTS\ki18n5\|*.pmap*
ExcludeKey6=PATH|%ProgramFiles%\Okular\share\locale\en*\LC_MESSAGES\|*.mo
ExcludeKey7=PATH|%ProgramFiles%\Okular\share\osi\en\|*.xml
ExcludeKey8=PATH|%ProgramFiles%\Okular\translations\|*_en.qm

[Omnify Hotspot Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Treexy\Omnify Hotspot
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Treexy\Omnify Hotspot\Languages|Strings.*.resources
ExcludeKey1=FILE|%ProgramFiles%\Treexy\Omnify Hotspot\Languages\|Strings.en.resources

[One System Care Languages *]
Section=Language Files
DetectFile=%AppData%\One System Care
Warning=This will delete all languages excluding English.
FileKey1=%AppData%\One System Care\languages|*.json
ExcludeKey1=FILE|%AppData%\One System Care\languages\|English.json

[OneSafe PC Cleaner Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\OneSafe PC Cleaner
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\OneSafe PC Cleaner|*.ini
ExcludeKey1=FILE|%ProgramFiles%\OneSafe PC Cleaner\|English.ini

[OpenShot Video Editor Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\OpenShot Video Editor
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\OpenShot Video Editor\language|*.qm
ExcludeKey1=PATH|%ProgramFiles%\OpenShot Video Editor\language\|OpenShot.en_*.qm
ExcludeKey2=PATH|%ProgramFiles%\OpenShot Video Editor\language\|qt*_en.qm

[Opera Browser Languages *]
Section=Language Files
Detect=HKCU\Software\Opera Software
Warning=This will delete all languages excluding English.
FileKey1=%LocalAppData%\Programs\Opera\*\Localization|*.pak
FileKey2=%ProgramFiles%\Opera\*\Localization|*.pak
ExcludeKey1=PATH|%LocalAppData%\Programs\Opera\*\Localization\|en-*.pak
ExcludeKey2=PATH|%ProgramFiles%\Opera\*\Localization\|en-*.pak

[OrderProg Clean Disk Free Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Clean Disk Free*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Clean Disk Free*\languages|*.txt
ExcludeKey1=FILE|%ProgramFiles%\Clean Disk Free*\languages\|english.txt

[Origin Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Origin
Warning=This will delete all languages excluding English.
FileKey1=%ProgramData%\Origin\SelfUpdate\Staged\support\Privacy and Cookie Policy|WEBPRIVACY_*.html
FileKey2=%ProgramData%\Origin\SelfUpdate\Staged\support\User Agreement|WEBTERMS_*.html
FileKey3=%ProgramFiles%\Origin\legacyPM\lang|*.xml
FileKey4=%ProgramFiles%\Origin\support\Privacy and Cookie Policy|WEBPRIVACY_*.html
FileKey5=%ProgramFiles%\Origin\support\User Agreement|WEBTERMS_*.html
ExcludeKey1=PATH|%ProgramData%\Origin\SelfUpdate\Staged\support\Privacy and Cookie Policy\|WEBPRIVACY_*_en_*.html
ExcludeKey2=PATH|%ProgramData%\Origin\SelfUpdate\Staged\support\User Agreement\|WEBTERMS_*_en_*.html
ExcludeKey3=PATH|%ProgramFiles%\Origin\legacyPM\lang\|*Strings_en_*.xml
ExcludeKey4=PATH|%ProgramFiles%\Origin\support\Privacy and Cookie Policy\|WEBPRIVACY_*_en_*.html
ExcludeKey5=PATH|%ProgramFiles%\Origin\support\User Agreement\|WEBTERMS_*_en_*.html

[Overwatch Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Overwatch
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Overwatch\WebBrowserProxy\locales|*.pak
ExcludeKey1=PATH|%ProgramFiles%\Overwatch\WebBrowserProxy\locales\|en-*.pak

[Obsidium *]
Section=Dangerous Utilities
Detect1=HKCU\Software\Obsidium
Detect2=HKCU\Software\Obsidium x64
DetectFile=%AppData%\Obsidium*
Warning=This will remove Obsidium software protection. The programs protected by this tool will continue to function as usual.
FileKey1=%AppData%\Obsidium*|*|REMOVESELF
FileKey2=%UserProfile%\Obsidium*|*|REMOVESELF
RegKey1=HKCU\Software\Obsidium
RegKey2=HKCU\Software\Obsidium x64

[Old Windows Installation *]
Section=Dangerous Windows
Detect=HKLM\Software\Microsoft
Warning=This will make it impossible to rollback to the previous Windows installation.
FileKey1=%SystemDrive%\$INPLACE.~TR|*|REMOVESELF
FileKey2=%SystemDrive%\$SysReset|*|REMOVESELF
FileKey3=%SystemDrive%\$Windows.~BT|*|REMOVESELF
FileKey4=%SystemDrive%\$WINDOWS.~Q|*|REMOVESELF
FileKey5=%SystemDrive%\$Windows.~WS|*|REMOVESELF
FileKey6=%SystemDrive%\$WinREAgent|*|REMOVESELF
FileKey7=%SystemDrive%\Windows.old*|*|REMOVESELF

[OpenRA Replays *]
Section=Dangerous Games
DetectFile=%Documents%\OpenRA
Warning=This will remove all of your replays.
FileKey1=%Documents%\OpenRA\Replays|*|RECURSE

[Opera Indexed Database Extended *]
Section=Dangerous Opera
Detect=HKCU\Software\Opera Software
Warning=This may cause some extensions to not work as intended.
FileKey1=%AppData%\Opera Software\Opera*\IndexedDB|*|RECURSE

[Opera Local Storage Extended *]
Section=Dangerous Opera
Detect=HKCU\Software\Opera Software
Warning=This may cause some extensions to not work as intended.
FileKey1=%AppData%\Opera Software\Opera*\Local Storage\leveldb|*
