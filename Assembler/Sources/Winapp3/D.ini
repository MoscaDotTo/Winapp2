[Daemon Tools Languages *]
Section=Language Files
Detect=HKCU\Software\DT Soft
DetectFile=%ProgramFiles%\DAEMON Tools*
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\DAEMON Tools*\Lang|*.dll
ExcludeKey1=FILE|%ProgramFiles%\DAEMON Tools*\Lang\|ENU.dll

[DC++ Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\DC++
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\DC++\locale|*.mo;*.txt;cshelp.rtf;DCPlusPlus.chm|REMOVESELF
ExcludeKey1=FILE|%ProgramFiles%\DC++\locale\en_*\|name.txt
ExcludeKey2=FILE|%ProgramFiles%\DC++\locale\en_*\help\|cshelp.rtf
ExcludeKey3=FILE|%ProgramFiles%\DC++\locale\en_*\help\|DCPlusPlus.chm
ExcludeKey4=PATH|%ProgramFiles%\DC++\locale\en_*\LC_MESSAGES\|*.mo

