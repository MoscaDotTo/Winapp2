; This file is part of a collection of winapp2ool ini files that are used to generate winapp3.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; The entries in winapp3.ini are more aggressive than the ones in winapp2.ini
; Some may delete files their software or your system needs, and some take a very long time to scan
;
; This file is one of 27 alphabetically-split source files used by winapp2ool's EntryBuilder module
; At runtime, all 27 source files are combined in-memory to generate winapp3.ini entries
;
; This file contains entries for applications whose names begin with the letter D
