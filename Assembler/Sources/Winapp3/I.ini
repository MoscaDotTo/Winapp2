[Icecream Image Resizer Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\Icecream Image Resizer
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\Icecream Image Resizer\Translations|ImageResizerGUI_*.qm
ExcludeKey1=FILE|%ProgramFiles%\Icecream Image Resizer\Translations\|ImageResizerGUI_en.qm

