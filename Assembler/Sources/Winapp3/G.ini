[Generic Useless Files Deleter for Games *]
Section=Dangerous Games
DetectFile1=%AppData%\Origin
DetectFile2=%ProgramFiles%\Epic Games*
DetectFile3=%ProgramFiles%\GOG.com
DetectFile4=%ProgramFiles%\Steam (x86)\SteamApps
DetectFile5=%SystemDrive%\GOG Games
Warning=This might delete important files.
FileKey1=%AppData%\Origin\*|*.log;*.tmp|RECURSE
FileKey2=%AppData%\Origin\*\_Redist|*|RECURSE
FileKey3=%AppData%\Origin\*\logs|*|RECURSE
FileKey4=%ProgramFiles%\Epic Games*\*|*.log;*.tmp|RECURSE
FileKey5=%ProgramFiles%\Epic Games*\*\_Redist|*|RECURSE
FileKey6=%ProgramFiles%\Epic Games*\*\logs|*|RECURSE
FileKey7=%ProgramFiles%\GOG.com\*|*.log;*.tmp|RECURSE
FileKey8=%ProgramFiles%\GOG.com\*\_Redist|*|RECURSE
FileKey9=%ProgramFiles%\GOG.com\*\logs|*|RECURSE
FileKey10=%ProgramFiles%\Steam (x86)\SteamApps\Common\*|*.log;*.tmp|RECURSE
FileKey11=%ProgramFiles%\Steam (x86)\SteamApps\Common\*\_Redist|*|RECURSE
FileKey12=%ProgramFiles%\Steam (x86)\SteamApps\Common\*\logs|*|RECURSE
FileKey13=%SystemDrive%\GOG Games\*|*.log;*.tmp|RECURSE
FileKey14=%SystemDrive%\GOG Games\*\_Redist|*|RECURSE
FileKey15=%SystemDrive%\GOG Games\*\logs|*|RECURSE
