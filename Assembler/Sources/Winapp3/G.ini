[GeoVid Video Avatar Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\GeoVid\Video Avatar
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\GeoVid\Video Avatar\lang|*.txt
ExcludeKey1=FILE|%ProgramFiles%\GeoVid\Video Avatar\lang\|English.txt

[GetFLV Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\GetFLV
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\GetFLV\chrome*\locales|*.pak
FileKey2=%ProgramFiles%\GetFLV\languages|*.ini
ExcludeKey1=FILE|%ProgramFiles%\GetFLV\languages\|en.ini
ExcludeKey2=PATH|%ProgramFiles%\GetFLV\chrome*\locales\|en-*.pak

[GetGo Download Manager Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\GetGo Download Manager
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\GetGo Download Manager\Translations|Resource_*.dll
ExcludeKey1=FILE|%ProgramFiles%\GetGo Download Manager\Translations\|Resource_En.dll

[GIGABYTE Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\GIGABYTE
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\GIGABYTE\@BIOS\Languages|FlashBios.xml|REMOVESELF
FileKey2=%ProgramFiles%\GIGABYTE\AppCenter\Lang|data.xml|REMOVESELF
FileKey3=%ProgramFiles%\GIGABYTE\CloudStation_Server\Lang|data.xml|REMOVESELF
FileKey4=%ProgramFiles%\GIGABYTE\EasyTune\Languages|*Tune.xml|REMOVESELF
FileKey5=%ProgramFiles%\GIGABYTE\EasyTuneEngineService\Languages|*.xml|REMOVESELF
FileKey6=%ProgramFiles%\GIGABYTE\OnOffCharge*\language|data.xml|REMOVESELF
FileKey7=%ProgramFiles%\GIGABYTE\SIV\Languages|*.xml|REMOVESELF
FileKey8=%ProgramFiles%\GIGABYTE\Smart Backup\Languages|*.xml|REMOVESELF
FileKey9=%ProgramFiles%\GIGABYTE\SmartKeyboard\Lang|data.xml|REMOVESELF
ExcludeKey1=FILE|%ProgramFiles%\GIGABYTE\@BIOS\Languages\ENG\|FlashBios.xml
ExcludeKey2=FILE|%ProgramFiles%\GIGABYTE\AppCenter\Lang\eng\|data.xml
ExcludeKey3=FILE|%ProgramFiles%\GIGABYTE\CloudStation_Server\Lang\eng\|data.xml
ExcludeKey4=FILE|%ProgramFiles%\GIGABYTE\OnOffCharge*\language\ENG\|data.xml
ExcludeKey5=FILE|%ProgramFiles%\GIGABYTE\SmartKeyboard\Lang\Eng\|data.xml
ExcludeKey6=PATH|%ProgramFiles%\GIGABYTE\EasyTune\Languages\ENG\|*Tune.xml
ExcludeKey7=PATH|%ProgramFiles%\GIGABYTE\EasyTuneEngineService\Languages\ENG\|*.xml
ExcludeKey8=PATH|%ProgramFiles%\GIGABYTE\SIV\Languages\ENG\|*.xml
ExcludeKey9=PATH|%ProgramFiles%\GIGABYTE\Smart Backup\Languages\ENG\|*.xml

[GigaTribe Languages *]
Section=Language Files
DetectFile=%ProgramFiles%\GigaTribe
Warning=This will delete all languages excluding English.
FileKey1=%ProgramFiles%\GigaTribe\languages|*.qm;*.ts
ExcludeKey1=FILE|%ProgramFiles%\GigaTribe\languages\|gigatribe_en.qm
