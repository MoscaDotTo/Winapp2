[YACReader *]
LangSecRef=3021
DetectFile=%LocalAppData%\YACReader\YACReader*
FileKey1=%LocalAppData%\YACReader\YACReader*|yacreader*.log

[Yahoo Autosync *]
Archive=Discontinued web browser plugin

LangSecRef=3022
Detect=HKCU\Software\Yahoo!\Autosync for Yahoo!
FileKey1=%ProgramFiles%\Yahoo!\Yahoo! Autosync\Logs|*

[Yahoo Companion *]
Archive=Discontinued web browser plugin

LangSecRef=3022
DetectFile=%ProgramData%\Yahoo! Companion
FileKey1=%ProgramData%\Yahoo! Companion\Cache|*

[Yahoo Messenger *]
Archive=Discontinued (2018)

LangSecRef=3022
Detect=HKCU\Software\Yahoo\Messenger
DetectFile=%ProgramFiles%\Yahoo!\Messenger
FileKey1=%LocalAppData%\yahoomessenger|SquirrelSetup.log
FileKey2=%ProgramFiles%\Yahoo!\Messenger|*.log;*.tmp|RECURSE

[Yahoo Messenger Cache *]
Archive=Discontinued (2018)

LangSecRef=3022
Detect=HKCU\Software\Yahoo\Messenger
Warning=You will need to reload the App next time its started. Select View, Reload from the menu.
FileKey1=%AppData%\Yahoo Messenger\Cache|*|RECURSE

[Yet Another Cleaner! *]
Archive=Discontinued

LangSecRef=3024
DetectFile1=%AppData%\Elex-Tech\Yac
DetectFile2=%ProgramFiles%\iSafe
FileKey1=%AppData%\eCyber\sysicons|*.ico
FileKey2=%AppData%\Elex-Tech\Yac\log|*
FileKey3=%AppData%\Elex-Tech\Yac\log_bak|*
FileKey4=%AppData%\iSafe\ico|*.ico
FileKey5=%AppData%\iSafe\log|*.log
FileKey6=%ProgramFiles%\iSafe\log|.log;*.zip
FileKey7=%ProgramFiles%\iSafe\tws|*log.txt
FileKey8=%ProgramFiles%\iSafe\tws\logs|*.log

[Your Freedom VPN *]
Archive=Discontinued

LangSecRef=3022
DetectFile=%ProgramFiles%\Your Freedom
FileKey1=%LocalAppData%\Your Freedom|*.old

[YouTube-DL *]
LangSecRef=3024
DetectFile=%UserProfile%\.cache\youtube-dl
FileKey1=%UserProfile%\.cache\youtube-dl|*|RECURSE

[YouTubeByClick *]
LangSecRef=3022
DetectFile=%AppData%\YouTubeByClick
FileKey1=%AppData%\YouTubeByClick|History.ytb

[YPOPs *]
Archive=Discontinued

LangSecRef=3021
DetectFile=%ProgramFiles%\YPOPs
FileKey1=%ProgramFiles%\YPOPs|ypops.log

[yWriter *]
LangSecRef=3021
DetectFile=%AppData%\Spacejock Software\yWriter*
FileKey1=%AppData%\Spacejock Software\yWriter*|Log.txt
FileKey2=%UserProfile%\Documents\Logs|*.txt
FileKey3=%UserProfile%\Documents\ywriter projects\*ywriter\Logs|*
FileKey4=%UserProfile%\Documents\ywriter projects\*ywriter\ywtemp|*
