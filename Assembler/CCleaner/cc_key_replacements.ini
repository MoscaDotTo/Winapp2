; cc_key_replacements.ini (c) 2025-2026 hazel ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Most entries in these files are incomplete and may not function as expected if used on their own
;
; winapp2ool uses this file to apply a CCleaner flavor to winapp2.ini
; This is done to reduce under and over-coverage
; winapp2ool applies this file using Transmute with the Transmute mode set to Replace - ByKey
;
; Corrections are always applied in order:
; section removals -> key name removals -> key value removals -> section replacements
; -> key replacements (this file) -> additions
;
; Any keys defined here will replace entirely keys in the entry of the same name in winapp2.ini
; Only keys of exactly the same name within sections of the exact same name will be replaced
; To replace an entire section, place the replacement data in cc_section_replacements.ini
;
; [*Map: label] sections define global key mapping rules: any key in any entry whose KeyType and
; Value match a Match= criterion is replaced whole (including its Name) by the Replace= key.
; The rules below convert the base file's Section= browser categories into CCleaner's built-in
; LangSecRef categories across every entry, replacing the per-entry cohorts formerly maintained
; in lockstep between cc_name_removals.ini and cc_additions.ini

[*Map: Arc]
Match=Section=Arc Web Browser
Replace=LangSecRef=3039

[*Map: Avast]
Match=Section=Avast Secure Web Browser
Replace=LangSecRef=3037

[*Map: AVG]
Match=Section=AVG Secure Web Browser
Replace=LangSecRef=3038

[*Map: Avira]
Match=Section=Avira Secure Web Browser
Replace=LangSecRef=3044

[*Map: Brave]
Match=Section=Brave Web Browser
Replace=LangSecRef=3034

[*Map: CCleaner Browser]
Match=Section=CCleaner Web Browser
Replace=LangSecRef=3032

[*Map: Chrome]
Match=Section=Google Chrome Web Browser
Replace=LangSecRef=3029

[*Map: Edge]
Match=Section=Microsoft Edge Web Browser
Replace=LangSecRef=3006

[*Map: Firefox]
Match=Section=Mozilla Firefox Web Browser
Replace=LangSecRef=3026

[*Map: Norton]
Match=Section=Norton Secure Web Browser
Replace=LangSecRef=3043

[*Map: Opera GX]
Match=Section=Opera GX Web Browser
Replace=LangSecRef=3035

[*Map: Opera]
Match=Section=Opera Web Browser
Replace=LangSecRef=3027

[*Map: Thunderbird]
Match=Section=Thunderbird Email Client
Replace=LangSecRef=3030

[*Map: Vivaldi]
Match=Section=Vivaldi Web Browser
Replace=LangSecRef=3033
