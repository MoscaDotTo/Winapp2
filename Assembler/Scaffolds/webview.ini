; webview.ini (c) 2026 Hazel Ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Shared scaffold catalog for embedded Chromium WebView / WebView2 (EBWebView) data folders.
; Winapp2ool uses this information to automatically generate FileKeys for applications by scaffold
;
; This file contains one section type:
;
; WebViewScaffold
; Defines FileKey patterns that may be selectively applied to generated webview-bearing entries
; Every WebViewScaffold section name must have the format [WebViewScaffold: Template Name]
;
; WebViewScaffold sections support the following keys:
;
; FileKeyBase
; A FileKey template applied to entries that select this scaffold
; Use %WebViewRoot% to reference the application's EBWebView (or equivalent) user data folder
; %WebViewRoot% is substituted by the consuming builder for each declared root path
;
; Tier
; Tier=Legacy withholds the scaffold from the All sentinel. It is emitted only when an entry names
;
; Conceptually parallel to chromium.ini in BrowserBuilder. Kept separate to allow independent
; evolution; webview hosts often track older Chromium file layouts than full browsers, and
; cross-pollination between the two catalogs has not been required yet.
;
; Default set (used when an entry declares no WebViewScaffolds= key): Caches, Telemetry
;
; Host-risk scaffolds remove data that the host application may treat as primary user state:
; LoginData, WebCookies, WebHistory, WebSession, WebStorage. All includes them, so an entry that selects All
; must manually exclude the ones it needs to keep.


[WebViewScaffold: Autofill]
FileKeyBase=%WebViewRoot%\*|*Web Data
FileKeyBase=%WebViewRoot%\*\AutoFill*|*|REMOVESELF
FileKeyBase=%WebViewRoot%\AutoFill*|*|REMOVESELF

[WebViewScaffold: Autoplay]
