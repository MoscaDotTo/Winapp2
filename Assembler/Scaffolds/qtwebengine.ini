;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Shared scaffold catalog for embedded QtWebEngine data folders.
; Winapp2ool uses this information to automatically generate FileKeys for applications by scaffold
;
; This file contains one section type:
;
; QtWebEngineScaffold
; Defines FileKey patterns that may be selectively applied to generated QtWebEngine-bearing entries
; Every QtWebEngineScaffold section name must have the format [QtWebEngineScaffold: Template Name]
;
; QtWebEngineScaffold sections support the following key:
;
; FileKeyBase
; A FileKey template applied to entries that select this scaffold
; Use %QtWebEngineRoot% to reference the application's QtWebEngine data folder (the folder
; literally named QtWebEngine, e.g. %LocalAppData%\AppName\QtWebEngine). The profile segment
; (\Default\) is baked into the templates here, since the overwhelming majority of QtWebEngine
; hosts use the Default profile. %QtWebEngineRoot% is substituted by the consuming builder for
; each declared root path.
;
; Separate from webview.ini by design. QtWebEngine bundles a markedly older Chromium than
; WebView2/EBWebView, with a flatter on-disk layout: network state (Cookies, Network Persistent
; State, Visited Links) lives directly under the profile rather than in a Default\Network\
; subfolder, and the modern privacy-sandbox surface (Trust Tokens, First-Party Sets, Topics,
; Shared Storage, Interest Groups) does not exist. Reusing the webview.ini paths here would emit
; FileKeys for folders QtWebEngine never creates, so the two catalogs are kept apart.
;
; Hosts that use a non-Default profile (e.g. calibre's OffTheRecord / viewer-lookup profiles)
; are not served by these scaffolds and should declare their targets via FileKeyBase= on the
; entry instead.
;
; Scaffold tiers (callers choose which to emit per entry):
;
;   Default-on:        Caches, Telemetry
;   Opt-in (host-risk): WebCookies, WebHistory, WebSession, WebStorage
;
; Host-risk scaffolds remove data that the host application may treat as primary user state
; (logged-in sessions, browsing history). They require explicit opt-in by the entry author and
; are never included in the default set.


[QtWebEngineScaffold: Caches]
FileKeyBase=%QtWebEngineRoot%\Default\*Cache|*|RECURSE
FileKeyBase=%QtWebEngineRoot%\Default\GPUCache|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default\blob_storage|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default\File System|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default\Platform Notifications|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default\Service Worker|*|REMOVESELF

[QtWebEngineScaffold: Telemetry]
FileKeyBase=%QtWebEngineRoot%\Default|*-journal;*.log;*.old;LOG;LOG.old;Network Persistent State
FileKeyBase=%QtWebEngineRoot%\Default\VideoDecodeStats|*|REMOVESELF

[QtWebEngineScaffold: WebCookies]
FileKeyBase=%QtWebEngineRoot%\Default|Cookies*

[QtWebEngineScaffold: WebHistory]
FileKeyBase=%QtWebEngineRoot%\Default|History*;Top Sites*;Visited Links

[QtWebEngineScaffold: WebSession]
FileKeyBase=%QtWebEngineRoot%\Default\Session Storage|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default\Sessions|*|REMOVESELF

[QtWebEngineScaffold: WebStorage]
FileKeyBase=%QtWebEngineRoot%\Default\IndexedDB|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default\Local Storage|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Default|QuotaManager*
