;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Shared scaffold catalog for embedded QtWebEngine data folders.
; Winapp2ool uses this information to automatically generate FileKeys for applications by scaffold
;
; This file contains one section type:
;
; QtWebEngineScaffold
; Defines FileKey patterns that may be selectively applied to generated QtWebEngine-bearing entries
; Every QtWebEngineScaffold section name must have the format [QtWebEngineScaffold: Template Name]
;
; QtWebEngineScaffold sections support the following keys:
;
; Tier
; Tier=Legacy withholds the scaffold from the "All" flag; these scaffolds are used only when named.
;
; FileKeyBase
; A FileKey template applied to entries that select this scaffold
; Two root variables are available:
;
; %QtWebEngineRoot%
; one QtWebEngine profile directory, profile segment included
; e.g. %LocalAppData%\AppName\QtWebEngine\Default
;
; %QtWebEngineCacheRoot%
; the directory holding that profile's HTTP Cache\ folder. 
; Qt keeps the cache under its CacheLocation rather than beside the profile
; e.g. %LocalAppData%\VideoKeeper\cache\QtWebEngine\Default
;
; Each variable is substituted once per root. 
; A template with no declared root generates nothing.
;
; The profile segment is part of the declared root rather than baked into the templates here.
; Most apps use the Default profile and will declare exactly one root.
;
; Unlike the other engines, QtWebEngine keeps network state (Cookies, TransportSecurity, Network
; Persistent State) at the profile root in every Qt version, so there are no Network\ templates.
;
; Default set (used when an entry declares no QtWebEngineScaffolds= key):
;   Caches, StorageQuota, Telemetry, VisitedLinks
;
; Host-risk scaffolds remove data that the host application may treat as primary user state:
; WebCookies, WebHistory, WebSession, WebStorage. All includes them, so an entry that selects All
; must manually exclude the ones it needs to keep.


[QtWebEngineScaffold: Caches]
FileKeyBase=%QtWebEngineRoot%\*Cache*|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\blob_storage|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Platform Notifications|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Service Worker\*Cache*|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Shared Dictionary\cache|*|REMOVESELF
FileKeyBase=%QtWebEngineCacheRoot%\Cache|*|REMOVESELF

[QtWebEngineScaffold: Favicons]
FileKeyBase=%QtWebEngineRoot%|Favicons*

[QtWebEngineScaffold: PrivacySandbox]
FileKeyBase=%QtWebEngineRoot%|SharedStorage*;Trust Tokens*

[QtWebEngineScaffold: Security]
FileKeyBase=%QtWebEngineRoot%|TransportSecurity*

[QtWebEngineScaffold: StorageQuota]
FileKeyBase=%QtWebEngineRoot%|QuotaManager*

[QtWebEngineScaffold: Telemetry]
FileKeyBase=%QtWebEngineRoot%|*-journal;*.log;*.old;LOG;LOG.old;Network Persistent State;Origin Bound Certs|RECURSE

[QtWebEngineScaffold: VisitedLinks]
FileKeyBase=%QtWebEngineRoot%|Visited Links

[QtWebEngineScaffold: WebCookies]
FileKeyBase=%QtWebEngineRoot%|Cookies*

[QtWebEngineScaffold: WebHistory]
FileKeyBase=%QtWebEngineRoot%|History*;Top Sites*

[QtWebEngineScaffold: WebSession]
FileKeyBase=%QtWebEngineRoot%\Session Storage|*|REMOVESELF

[QtWebEngineScaffold: WebStorage]
FileKeyBase=%QtWebEngineRoot%\databases|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\IndexedDB|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Local Storage|*|REMOVESELF
FileKeyBase=%QtWebEngineRoot%\Shared Dictionary|db*

; Legacy tier: withheld from All, emitted only when named

[QtWebEngineScaffold: LegacyTelemetry]
Tier=Legacy
FileKeyBase=%QtWebEngineRoot%\VideoDecodeStats|*|REMOVESELF

[QtWebEngineScaffold: LegacyWebStorage]
Tier=Legacy
FileKeyBase=%QtWebEngineRoot%\File System|*|REMOVESELF
