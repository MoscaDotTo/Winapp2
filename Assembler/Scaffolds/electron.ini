;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Shared scaffold catalog for Electron application data folders.
; Winapp2ool uses this information to automatically generate FileKeys for applications by scaffold
;
; This file contains one section type:
;
; ElectronScaffold
; Defines FileKey patterns that may be selectively applied to generated Electron-bearing entries
; Every ElectronScaffold section name must have the format [ElectronScaffold: Template Name]
;
; ElectronScaffold sections support the following key:
;
; FileKeyBase
; A FileKey template applied to entries that select this scaffold
; Two root placeholders are available, and a template may use either:
;
;   %ElectronRoot%         one Chromium profile directory, which for Electron is the app's
;                          userData folder itself, e.g. %AppData%\Signal. There is NO Default\
;                          segment: Electron collapses Chromium's user-data-dir and profile
;                          levels into a single directory.
;   %ElectronUpdaterRoot%  the electron-updater download cache, e.g. %LocalAppData%\Signal-Desktop-Updater.
;                          Declared separately because its name is electron-builder's appId slug
;                          and is not derivable from the userData path (%AppData%\Humble App pairs
;                          with %LocalAppData%\humble-client-updater).
;
; Each placeholder is substituted by the consuming builder once per root the entry declared for
; it. A template whose placeholder has no declared root emits nothing, so an entry that declares
; only %ElectronRoot% silently skips the updater templates.
;
; Scaffold tiers (callers choose which to emit per entry):
;
;   Default-on:         AppLogs, Caches, StorageQuota, Telemetry, UpdaterCache
;   Opt-in (safe):      MediaDRM, PrivacySandbox, Security, TempFiles
;   Opt-in (host-risk): WebCookies, WebStorage
;
; Host-risk scaffolds remove data the host application may treat as primary user state (logged-in
; sessions, site storage). They require explicit opt-in by the entry author and are never included
; in the default set.


[ElectronScaffold: AppLogs]
FileKeyBase=%ElectronRoot%|*.log;log.log
FileKeyBase=%ElectronRoot%\*Logs|*|RECURSE
FileKeyBase=%ElectronRoot%\*\*Logs|*|RECURSE

[ElectronScaffold: Caches]
FileKeyBase=%ElectronRoot%|*-journal|RECURSE
FileKeyBase=%ElectronRoot%\*Cache*|*|REMOVESELF
FileKeyBase=%ElectronRoot%\blob_storage|*|REMOVESELF
FileKeyBase=%ElectronRoot%\Service Worker\*Cache*|*|REMOVESELF
FileKeyBase=%ElectronRoot%\Shared Dictionary\cache|*|REMOVESELF
FileKeyBase=%ElectronRoot%\shared_proto_db|*|REMOVESELF

[ElectronScaffold: MediaDRM]
FileKeyBase=%ElectronRoot%\*WidevineCdm|*|REMOVESELF

[ElectronScaffold: PrivacySandbox]
FileKeyBase=%ElectronRoot%|SharedStorage*
FileKeyBase=%ElectronRoot%\Network|Trust Tokens*

[ElectronScaffold: Security]
FileKeyBase=%ElectronRoot%|DIPS*
FileKeyBase=%ElectronRoot%\Network|TransportSecurity*

[ElectronScaffold: StorageQuota]
FileKeyBase=%ElectronRoot%\WebStorage|QuotaManager*
FileKeyBase=%ElectronRoot%|QuotaManager*

[ElectronScaffold: Telemetry]
FileKeyBase=%ElectronRoot%|*.old;LOG;LOG.old|RECURSE
FileKeyBase=%ElectronRoot%|Network Persistent State*;Origin Bound Certs;Visited Links*
FileKeyBase=%ElectronRoot%\Network|Network Persistent State*;Reporting and NEL*;SCT Auditing Pending Reports*
FileKeyBase=%ElectronRoot%\Crashpad|*|REMOVESELF
FileKeyBase=%ElectronRoot%\sentry|*|REMOVESELF
FileKeyBase=%ElectronRoot%\VideoDecodeStats|*|REMOVESELF
FileKeyBase=%ElectronRoot%\webrtc_event_logs|*|REMOVESELF

[ElectronScaffold: TempFiles]
FileKeyBase=%ElectronRoot%\Temp|*|REMOVESELF
FileKeyBase=%ElectronRoot%\tmp|*|REMOVESELF

[ElectronScaffold: UpdaterCache]
FileKeyBase=%ElectronUpdaterRoot%|*.7z;*.exe
FileKeyBase=%ElectronUpdaterRoot%\pending|*|REMOVESELF

[ElectronScaffold: WebCookies]
FileKeyBase=%ElectronRoot%\Network|Cookies*;Device Bound Sessions*
FileKeyBase=%ElectronRoot%|Cookies*

[ElectronScaffold: WebStorage]
FileKeyBase=%ElectronRoot%\databases|*|REMOVESELF
FileKeyBase=%ElectronRoot%\IndexedDB|*|REMOVESELF
FileKeyBase=%ElectronRoot%\Local Storage\leveldb|*|REMOVESELF
FileKeyBase=%ElectronRoot%\Session Storage|*|REMOVESELF
FileKeyBase=%ElectronRoot%\Shared Dictionary|db*
