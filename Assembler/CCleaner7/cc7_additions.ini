; cc7_additions.ini (c) 2026 hazel ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; winapp2ool uses this file to apply the CCleaner 7 flavor to the CCleaner flavor of winapp2.ini
; CCleaner 7 requires ID= and Author= keys on every cleaning definition
; winapp2ool applies this file using Transmute with the Transmute mode set to Add
;
; Corrections are always applied in order:
; section removals -> key name removals -> key value removals -> section replacements
; -> key replacements -> additions (this file)
;
; The [*] section applies its keys to every entry in the base file. The %EntryName% token is
; replaced with each receiving entry's name (including the trailing " *"), giving every entry
; a unique ID from a single global key

[*]
ID=%EntryName%
Author=Winapp2.ini Project
