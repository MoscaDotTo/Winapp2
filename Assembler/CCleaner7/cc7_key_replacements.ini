; cc7_key_replacements.ini (c) 2026 hazel ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; winapp2ool uses this file to apply the CCleaner 7 flavor to the CCleaner flavor of winapp2.ini
; CCleaner 7 replaces the LangSecRef/Section categorization system with a comma-delimited Tags string
; winapp2ool applies this file using Transmute with the Transmute mode set to Replace - ByKey
;
; Corrections are always applied in order:
; section removals -> key name removals -> key value removals -> section replacements
; -> key replacements (this file) -> additions
;
; [*Map: label] sections define global key mapping rules: any key in any entry whose KeyType and
; Value match a Match= criterion is replaced whole (including its Name) by the Replace= key.
; The rules below convert each entry's LangSecRef= or Section= category key into the
; corresponding CCleaner 7 Tags= key
;
; A Match value of exactly * is a wildcard matching any value of that KeyType. Because rules are
; first-match-wins in file order, the wildcard fallback rule MUST remain the last section in this
; file: every category not claimed by a specific rule above it funnels into Tags=ccapps
;
; Rules for categories with no current entries emit a "matched nothing" warning during the build.
; This is expected for dormant categories and is not an error - the rules are kept future-proof

[*Map: Applications]
Match1=LangSecRef=3021
Match2=Section=Games
Replace=Tags=ccapps

[*Map: Edge]
Match1=LangSecRef=3005
Match2=LangSecRef=3006
Replace=Tags=Microsoft,Browser,Edge

[*Map: Internet]
Match=LangSecRef=3022
Replace=Tags=ccinternet

[*Map: Multimedia]
Match=LangSecRef=3023
Replace=Tags=ccmedia

[*Map: Utilities]
Match=LangSecRef=3024
Replace=Tags=ccutil

[*Map: Windows]
Match=LangSecRef=3025
Replace=Tags=ccwindows

[*Map: Firefox]
Match=LangSecRef=3026
Replace=Tags=Mozilla,FireFox,Browser

[*Map: Opera]
Match=LangSecRef=3027
Replace=Tags=Opera,Browser

[*Map: Chrome]
Match=LangSecRef=3029
Replace=Tags=Google,Chrome,Browser

[*Map: Thunderbird]
Match=LangSecRef=3030
Replace=Tags=Thunderbird,Email

[*Map: Windows Store]
Match=LangSecRef=3031
Replace=Tags=ccwinstore

[*Map: CCleaner Browser]
Match=LangSecRef=3032
Replace=Tags=CCleaner,Browser

[*Map: Vivaldi]
Match=LangSecRef=3033
Replace=Tags=Vivaldi,Browser

[*Map: Brave]
Match=LangSecRef=3034
Replace=Tags=Brave,Browser

[*Map: Opera GX]
Match=LangSecRef=3035
Replace=Tags=OperaGX,Browser

[*Map: Avast Secure Browser]
Match=LangSecRef=3037
Replace=Tags=Avast,Browser

[*Map: AVG Secure Browser]
Match=LangSecRef=3038
Replace=Tags=AVG,Browser

[*Map: Arc]
Match=LangSecRef=3039
Replace=Tags=ARC,Browser

[*Map: Norton Secure Browser]
Match=LangSecRef=3043
Replace=Tags=Norton,Browser

[*Map: Avira Secure Browser]
Match=LangSecRef=3044
Replace=Tags=Avira,Browser

[*Map: Fallback]
Match1=LangSecRef=*
Match2=Section=*
Replace=Tags=ccapps
