; fc_additions.ini (c) 2026 hazel ward
;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Most entries in these files are incomplete and may not function as expected if used on their own
;
; winapp2ool uses this file to apply a FluentCleaner flavor to winapp2.ini
; This is done to reduce undercoverage
; Winapp2ool applies this file using Transmute with the Transmute mode set to Add
;
; Corrections are always applied in order:
; section removals -> key name removals -> key value removals -> section replacements
; -> key replacements -> additions (this file)
;
; Any keys defined here will be added to the section of the same name in winapp2.ini
; If you are simply adding to an existing entry, provide only the new keys
; If no such section exists, a new one will be created and added
; If you are adding an entirely new entry, be sure that it is complete (section keys, detect criteria, etc)

; FluentCleaner parses winapp2.ini entries as on by default, and makes downstream
; changes to ensure these web browser scaffolds are disabled by default. We absorb
; that here with [*Name:] rules that pattern-match on the scaffold name and insert a
; Default=False key into each matching entry, so new BrowserBuilder browsers are
; covered automatically.
;
; Each rule selects entries whose name ends with " <scaffold> *" (the label carries the
; bare scaffold name; the engine appends the "*"), then confirms the entry
; is a browser via the Match= keys. 

[*Name: Autofill Data & Search Engine Preferences]
Match1=Section=* Web Browser
Match2=Section=* Email Client
Match3=Section=* Internet Suite
Match4=Section=* ArtisBrowser
Default=False

