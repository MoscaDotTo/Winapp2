; FluentCleaner adds warnings to some entries, these keys are taken
; directly from FluentCleaner's downstream copy of winapp2.ini
[Microsoft Office *]
Default=False
Warning=Heads up: this also clears your pinned/favorite files in Word, Excel and PowerPoint. Office stores pinned items in the same "recent files" list, so they get wiped along with the recent-documents history. Leave this unchecked if you rely on Office favorites.

[Windows Recent Documents *]
Default=False
Warning=Clears the recent documents list for all user accounts on this machine, not just the current user.

[Windows Shell - Folder/Dialog Box View Settings *]
Default=False
Warning=Resets all Explorer folder view preferences (icon/details/column layouts), window sizes, positions, and File Open/Save dialog history. All custom folder layouts will be lost permanently.

[Windows Shell *]
Default=False
Warning=Deletes Explorer\FileExts which stores your custom file type associations (e.g. which app opens .jpg or .png). After cleaning, Windows will no longer remember your chosen default apps for file types until you reassign them manually.

[Windows Start Menu *]
Default=False
Warning=Resets the Start Menu program cache. The Start Menu may take a moment to rebuild on next login.

[Windows Taskbar *]
Default=False
Warning=Clears Jump Lists (recently used files shown per app on the taskbar). Pinned items are safe, but all recent file history will be removed.

