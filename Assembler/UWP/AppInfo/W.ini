;
; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Most entries in these files are incomplete and may not function as expected if used on their own
;
; This file is one of 27 alphabetically-split AppInfo files used by winapp2ool's UWPBuilder module
; At runtime, all 27 AppInfo files are combined in-memory and processed alongside UWP.ini
; to generate winapp2.ini entries for Universal Windows Platform (UWP) applications
;
; This file contains entries for applications whose names begin with the letter W
;
; Each section in the AppInfo files describes one UWP application, and is structured similarly
; to a standard winapp2.ini entry with a few additional variables and keys 
;
; Winapp2ool-Exclusive keys:
;
; Package
; The name of the directory containing the application's UWP package under %LocalAppData%\Packages
; For single-package applications, use Package=PACKAGE_FOLDER
; For multi-package applications, use Package1=, Package2=, etc.
; At least one Package key is required
; The package folder path is automatically used to generate DetectFiles in the output entries
; ie. DetectFile=%LocalAppData%\Packages\PACKAGE_FOLDER
; %Package% (or %Package1%, %Package2%, etc.) can be used as a variable in key values
; %Package% expands to %LocalAppData%\Packages\PACKAGE_FOLDER in the generated entry
; When multiple %PackageN% variables are defined, %Package% expands to each of them
;
; FileKeyBase (or FileKey)
; A FileKey template using %Package% or %PackageN% variables
; Standard FileKeys will also be passed through verbatim (after %Package% is expanded)
; Append standard FileKeys to target win32 locations for applications which have both UWP+win32 versions
; Numbers are not required as the keys will be renumbered after generation
;
; Skip
; Tells winapp2ool to skip this application when generating entries
; Used to discontinue support for an application without losing its configuration
; This value appears Boolean but is not. Skip=False _WILL_ result in the app being skipped
; Provide this key if and only if you want the app to be skipped during generation
;
; SkipUWPFileKeys
; Suppresses the scaffold FileKeyBase templates from UWP.ini for this entry only
; The entry is still generated: detection, category, app-specific keys, RegKeys, and ExcludeKeys
; are all emitted normally. Only the four baseline cleaning FileKeys are omitted.
; Use this when defining a secondary entry for an application that shares packages with a
; primary entry, so both entries do not redundantly clean the same \AC\, \TempState\, etc.
; Like Skip, this value is not Boolean: SkipUWPFileKeys=False _WILL_ suppress the scaffold keys
; Provide this key if and only if you want the scaffold FileKeys suppressed
;
; Variables (<> expansion)
; Any key whose name is not one of the keys documented above is a variable declaration
; The value is a comma-delimited list, referenced elsewhere in the entry as <Name>
; Each reference fans the containing key out into one key per value, eg:
;   Version=11.0,16.0
;   RegKey=HKCU\Software\Contoso\<Version>\File MRU
; generates one RegKey for 11.0 and one for 16.0
; Two distinct variables in one template produce the cartesian product of their values
; An inline list works without a declaration: <Default,OffTheRecord>
; Variables may reference other variables; declarations are flattened before generation
; Registry-domain keys (Detect, RegKey, REG ExcludeKey) keep an undeclared <Token> literally
; Filesystem-domain keys (DetectFile, FileKey, other ExcludeKeys) drop the key instead,
; because < and > are not legal Windows path characters
; Package= is NEVER variable-expanded: a fan-out there would shift every %PackageN% index
; Warning= is never expanded either, as its value is prose rather than a path template
; A declared variable that no <Token> references is reported as a probable typo

