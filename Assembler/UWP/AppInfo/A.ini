; This file is part of a collection of winapp2ool ini files that are used to generate winapp2.ini
; and thus is not intended to be used standalone or with any cleaning software
;
; Most entries in these files are incomplete and may not function as expected if used on their own
;
; This file is one of 27 alphabetically-split AppInfo files used by winapp2ool's UWPBuilder module
; At runtime, all 27 AppInfo files are combined in-memory and processed alongside UWP.ini
; to generate winapp2.ini entries for Universal Windows Platform (UWP) applications
;
; This file contains entries for applications whose names begin with the letter A
;
; Each section in the AppInfo files describes one UWP application, and is structured similarly
; to a standard winapp2.ini entry with a few additional variables and keys 
;
; Winapp2ool-Exclusive keys:
;
; Package
; The name of the directory containing the application's UWP package under %LocalAppData%\Packages
; For single-package applications, use Package=<FolderName>
; For multi-package applications, use Package1=, Package2=, etc.
; At least one Package key is required
; The package folder path is automatically used to generate DetectFiles in the output entries
; ie. DetectFile=%LocalAppData%\Packages\<PackageName>
; %Package% (or %Package1%, %Package2%, etc.) can be used as a variable in key values
; %Package% expands to %LocalAppData%\Packages\<PackageFolderName> in the generated entry
; When multiple %PackageN% variables are defined, %Package% expands to each of them
;
; FileKeyBase (or FileKey)
; A FileKey template using %Package% or %PackageN% variables
; Standard FileKeys will also be passed through verbatim (after %Package% is expanded)
; Append standard FileKeys to target win32 locations for applications which have both UWP+win32 versions
; Numbers are not required as the keys will be renumbered after generation
;
; Skip
; Tells winapp2ool to skip this application when generating entries
; Used to discontinue support for an application without losing its configuration
; This value appears Boolean but is not. Skip=False _WILL_ result in the app being skipped
; Provide this key if and only if you want the app to be skipped during generation

