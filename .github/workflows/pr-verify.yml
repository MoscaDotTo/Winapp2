# PR verify, build half: builds winapp2.ini from master before and after merging the PR, then
# reports either why the build broke or what the PR changes in the output.
#
# Security boundary: on the `pull_request` event a fork PR gets a read-only GITHUB_TOKEN and no
# repository secrets, which is what makes it safe to run the PR's committed winapp2ool.exe and
# build script here. This job can't write and posts nothing; it only uploads a text report.
# pr-verify-comment.yml (workflow_run, trusted, can write) reads that report and posts the
# comment without running any PR code. Don't add secrets, write permissions or
# pull_request_target here.
name: winapp2.ini PR verify

on:
  # Only PRs that touch the build inputs under Assembler/.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - Branch1
    paths:
      - 'Assembler/**'
      - '!Assembler/**.md'
      - '.github/workflows/pr-verify.yml'
      - '.github/scripts/pr-verify-build.ps1'
  # Manual button for testing: supply the two SHAs and a PR number directly.
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base (master) commit SHA'
        required: true
      head_sha:
        description: 'Head commit SHA to merge'
        required: true
      pr_number:
        description: 'PR number (for the report bundle)'
        required: true

# The security boundary from the header. Keep it read-only.
permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      PR_NUMBER: ${{ github.event.number || inputs.pr_number }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `git merge <head sha>` needs both commits here. A fork PR's head lives in the fork,
      # but GitHub exposes it in the base repo as refs/pull/<n>/head.
      - name: Fetch PR refs
        shell: pwsh
        run: |
          git fetch --no-tags origin "$env:BASE_SHA"
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git fetch --no-tags origin "+refs/pull/${{ github.event.number }}/head:refs/remotes/pr/head"
          } else {
            git fetch --no-tags origin "$env:HEAD_SHA"
          }

      - name: Build baseline, merge PR, build again, write report
        shell: pwsh
        run: |
          & '.github/scripts/pr-verify-build.ps1' `
            -BaseSha $env:BASE_SHA `
            -HeadSha $env:HEAD_SHA `
            -PrNumber $env:PR_NUMBER `
            -ReportDir "$env:RUNNER_TEMP/pr-verify-report"

      # Always upload: a PR that breaks the build is still a successful verification, and
      # the comment job needs its status.txt. Only a harness crash fails here.
      - name: Upload report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verify-report
          path: ${{ runner.temp }}/pr-verify-report/**
          if-no-files-found: warn
          retention-days: 7
