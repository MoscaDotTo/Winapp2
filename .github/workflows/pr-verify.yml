# PR-verify (build job): verifies open PRs against master by building winapp2.ini
# before and after merging the PR, then reporting either why the build broke or
# what the PR changes in the output.
#
# SECURITY BOUNDARY: this workflow runs on the `pull_request` event, which for fork
# PRs gives a read-only GITHUB_TOKEN and no repository secrets. That is what makes
# it safe to run the PR's committed winapp2ool.exe / build script here. This job
# has NO write access and posts nothing itself -- it only uploads a text report
# artifact. The separate pr-verify-comment.yml workflow (workflow_run, trusted,
# write-capable) reads that artifact and posts the PR comment; it never executes
# any PR code. Do NOT add secrets, write permissions, or pull_request_target here.
name: winapp2.ini PR verify

on:
  # Only fires on changes to the winapp2.ini build sources under Assembler/,
  # matching artifact-drift.yml's scope -- unrelated repo edits don't trigger a build.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - Branch1
    paths:
      - 'Assembler/**'
      - '!Assembler/**.md'
      - '.github/workflows/pr-verify.yml'
      - '.github/scripts/pr-verify-build.ps1'
  # Manual button for testing: supply the two SHAs and a PR number directly.
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base (master) commit SHA'
        required: true
      head_sha:
        description: 'Head commit SHA to merge'
        required: true
      pr_number:
        description: 'PR number (for the report bundle)'
        required: true

# Read-only, no secrets: the security boundary for running untrusted PR content.
permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    env:
      # Same unelevated-token override artifact-drift.yml uses so winapp2ool runs headless
      # without requesting elevation; child build processes inherit it.
      __COMPAT_LAYER: RunAsInvoker
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      PR_NUMBER: ${{ github.event.number || inputs.pr_number }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ensure both the base commit and the PR head object are present locally.
      # For fork PRs the head lives in the fork, but GitHub exposes it in the base
      # repo as refs/pull/<n>/head; fetch that so `git merge <head sha>` can resolve.
      - name: Fetch PR refs
        shell: pwsh
        run: |
          git fetch --no-tags origin "$env:BASE_SHA"
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git fetch --no-tags origin "+refs/pull/${{ github.event.number }}/head:refs/remotes/pr/head"
          } else {
            git fetch --no-tags origin "$env:HEAD_SHA"
          }

      - name: Build baseline, merge PR, build again, write report
        shell: pwsh
        run: |
          & '.github/scripts/pr-verify-build.ps1' `
            -BaseSha $env:BASE_SHA `
            -HeadSha $env:HEAD_SHA `
            -PrNumber $env:PR_NUMBER `
            -ReportDir "$env:RUNNER_TEMP/pr-verify-report"

      # Always upload -- a broken PR build is a *successful* verification whose
      # outcome (status.txt) the comment job needs. Only a harness crash fails here.
      - name: Upload report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verify-report
          path: ${{ runner.temp }}/pr-verify-report/**
          if-no-files-found: warn
          retention-days: 7
