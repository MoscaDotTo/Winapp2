# Release: whenever build-on-merge.yml produces an updated winapp2.ini, cut a
# GitHub Release tagged with that build's date version and attach the winapp2.ini
# family plus the current winapp2ool.exe.
#
# One release per build. The tag is v<date>. build-on-merge runs at most once a day (a
# daily schedule, not per-push), so normally each day has exactly one build and the tag
# is simply v<date>. The only way to get a second build the same day is a manual
# workflow_dispatch re-run; because that build's changelog covers only the delta since
# the day's earlier build, its release is tagged v<date>.2 (.3, ...) and kept ALONGSIDE
# the earlier one, so the sequence of per-release changelogs stays complete and gap-free
# rather than one release silently overwriting an earlier day-part's diff.
#
# It chains off build-on-merge via workflow_run (not a push trigger) because that
# workflow commits with the GITHUB_TOKEN, and token pushes don't fire push events.
# The build job hands everything over as the "release-bundle" artifact; if that
# artifact is absent, the build made no changes and there is nothing to release.
#
# Manual recovery (workflow_dispatch): from winapp2ool 1.8 on, clients download each flavor
# from the latest release rather than the tree, so a release missed after the build committed
# leaves every client a version behind until the next content change, and re-running the
# build can't fix it (it sees nothing changed). Dispatching this workflow releases master as
# it stands: the bundle comes from master's committed Releases/ files and Assembler/winapp2ool.exe,
# staged by the same script build-on-merge.yml uses (.github/scripts/release-assets.ps1), and
# the version is the highest "; Version:" stamp across master's seven Releases/ data files.
# It refuses when the latest release already carries that version, since re-releasing the
# same content would only add a duplicate release with an empty changelog.
name: winapp2.ini release

on:
  workflow_run:
    workflows: ["winapp2.ini build on merge"]
    types: [completed]
  workflow_dispatch:

# Needed to create tags and releases.
permissions:
  contents: write

concurrency:
  group: winapp2-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A dispatch always runs; a build run only when it succeeded, since a failed build has
    # nothing to publish.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download the release bundle from the build run
        if: github.event_name == 'workflow_run'
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Manual recovery only: release master's committed files.
      # The automatic path ships files the Windows build runner wrote, with CRLF line endings,
      # and git stores most of them normalized to LF. Check out the way that runner does
      # (core.autocrlf true) so a recovered release carries the same bytes.
      - name: Use Windows line endings for the checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: git config --global core.autocrlf true

      - name: Check out master
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Stage the release bundle from master
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'bundle'
          Push-Location master
          try {
            . ./.github/scripts/release-assets.ps1
            $version = Get-ReleaseVersion -Paths @($ReleaseDataFiles | ForEach-Object { "Releases/$_" })
            $sha = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $sha) { throw 'could not read master HEAD' }
            New-ReleaseBundle -Destination $bundle -Version $version -Sha $sha
          } finally {
            Pop-Location
          }
          Write-Host "Staged master ($sha) as v$version"

      - name: Refuse to re-release content the latest release already carries
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('fs').readFileSync('bundle/version.txt', 'utf8').trim();
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              })).data.tag_name;
            } catch (e) {
              if (e.status === 404) { core.info('No release exists yet.'); return; }
              throw e;
            }
            const base = `v${version}`;
            // The free-tag step below suffixes .2, .3, ... so v<version>.N carries the same version.
            const sameVersion = latest === base ||
              (latest.startsWith(`${base}.`) && /^\d+$/.test(latest.slice(base.length + 1)));
            if (sameVersion) {
              core.setFailed(`master's content (v${version}) is already released as ${latest}; nothing to recover.`);
            } else {
              core.info(`Latest release is ${latest}; releasing master as v${version}.`);
            }

      # ---- Both paths: bundle/ now holds the assets, version.txt and commit.txt.
      - name: Decide whether there is anything to release
        id: gate
        shell: bash
        run: |
          if [ ! -f bundle/version.txt ]; then
            echo "No release bundle -> the build produced no artifact changes. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat bundle/version.txt)" >> "$GITHUB_OUTPUT"
            echo "sha=$(cat bundle/commit.txt)" >> "$GITHUB_OUTPUT"
          fi

      # Tag is v<date>. Normally free (one build/day). A manual same-day re-run collides,
      # so suffix .2, .3, ... and keep the earlier release -- each release then carries a
      # distinct, sequential slice of the changelog (see the header note).
      - name: Compute a free tag
        id: tag
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('fs').readFileSync('bundle/version.txt', 'utf8').trim();
            const base = `v${version}`;
            let tag = base, n = 1;
            while (true) {
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                n += 1; tag = `${base}.${n}`;   // taken -> try next suffix
              } catch (e) {
                if (e.status === 404) break;     // free
                throw e;
              }
            }
            core.setOutput('tag', tag);

      - name: Create the GitHub Release
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.gate.outputs.sha }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Release notes = the base changelog this build produced. GitHub caps a release
          # body at 125,000 characters and rejects the whole create with a 422 if it is
          # exceeded, so the changelog is inlined only up to a budget well under that; the
          # complete text always ships as the changelog-base.txt asset regardless. A daily
          # diff is nowhere near the cap, but a build whose baseline is months old (or a
          # sweeping mechanical change across the database) easily is.
          #
          # Truncation is whole-lines-only: cutting at a byte offset can split a UTF-8
          # sequence mid-character and hand the API an invalid body.
          {
            echo "winapp2.ini \`${VERSION}\` automated build."
            echo "below is the base flavor's semantic changelog (diff.txt)"
            echo "all flavors and their changelogs are attached at the bottom alongside a copy of the latest winapp2ool"            
            echo
            echo '```'
            if [ -f bundle/changelog-base.txt ]; then
              awk -v budget=100000 '
                { total += length($0) + 1
                  if (total > budget) { truncated = 1; exit }
                  print }
                END { if (truncated) printf "\n... changelog truncated here; see the attached changelog-base.txt for the full text.\n" }
              ' bundle/changelog-base.txt
            else
              echo '(no base changelog produced)'
            fi
            echo '```'
          } > notes.md

          # Attach every asset except the internal metadata files.
          mapfile -t assets < <(find bundle -type f ! -name version.txt ! -name commit.txt | sort)

          gh release create "$TAG" "${assets[@]}" \
            --title "winapp2.ini $TAG" \
            --notes-file notes.md \
            --target "$SHA"
