# Release: when build-on-merge.yml produces an updated winapp2.ini, cut a GitHub Release tagged
# with that build's date and attach every flavor, its changelog and the current winapp2ool.exe.
#
# One release per build, tagged v<date>. build-on-merge runs once a day, so normally that tag is
# free. A second build the same day only happens through a manual workflow_dispatch, and its
# changelog covers only the change since the earlier build, so it gets v<date>.2 (.3, ...) and
# the earlier release stays. That way no release overwrites another's slice of the changelog.
#
# It chains off build-on-merge through workflow_run because that workflow commits with the
# GITHUB_TOKEN, and token pushes don't fire push events. The build hands everything over as the
# "release-bundle" artifact, and no artifact means the build had nothing to release.
#
# Manual recovery (workflow_dispatch): from 1.8 on, clients download each flavor from the latest
# release rather than the tree, so a release that goes missing after the build committed leaves
# every client a version behind until the next content change. Re-running the build can't fix
# that, because it sees nothing changed. Dispatching this workflow releases master as it stands:
# the bundle comes from master's committed Releases/ files and Assembler/winapp2ool.exe, staged
# by the same script build-on-merge.yml uses (.github/scripts/release-assets.ps1), and the
# version is the highest "; Version:" stamp across master's seven Releases/ data files. It
# refuses when the latest release already has that version, since all we'd get is a duplicate
# release with an empty changelog.
name: winapp2.ini release

on:
  workflow_run:
    workflows: ["winapp2.ini build on merge"]
    types: [completed]
  workflow_dispatch:

# Needed to create tags and releases.
permissions:
  contents: write

concurrency:
  group: winapp2-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A dispatch always runs. A build run only counts if it succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download the release bundle from the build run
        if: github.event_name == 'workflow_run'
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Manual recovery only: release master's committed files.
      # The automatic path ships files the Windows build runner wrote, with CRLF line endings,
      # and git stores most of them normalized to LF. Check out the way that runner does
      # (core.autocrlf true) so a recovered release carries the same bytes.
      - name: Use Windows line endings for the checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: git config --global core.autocrlf true

      - name: Check out master
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Stage the release bundle from master
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'bundle'
          Push-Location master
          try {
            . ./.github/scripts/release-assets.ps1
            $version = Get-ReleaseVersion -Paths @($ReleaseDataFiles | ForEach-Object { "Releases/$_" })
            $sha = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $sha) { throw 'could not read master HEAD' }
            New-ReleaseBundle -Destination $bundle -Version $version -Sha $sha
          } finally {
            Pop-Location
          }
          Write-Host "Staged master ($sha) as v$version"

      - name: Refuse to re-release content the latest release already carries
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('fs').readFileSync('bundle/version.txt', 'utf8').trim();
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              })).data.tag_name;
            } catch (e) {
              if (e.status === 404) { core.info('No release exists yet.'); return; }
              throw e;
            }
            const base = `v${version}`;
            // The free-tag step below suffixes .2, .3, ... so v<version>.N carries the same version.
            const sameVersion = latest === base ||
              (latest.startsWith(`${base}.`) && /^\d+$/.test(latest.slice(base.length + 1)));
            if (sameVersion) {
              core.setFailed(`master's content (v${version}) is already released as ${latest}; nothing to recover.`);
            } else {
              core.info(`Latest release is ${latest}; releasing master as v${version}.`);
            }

      # ---- Both paths: bundle/ now holds the assets, version.txt and commit.txt.
      - name: Decide whether there is anything to release
        id: gate
        shell: bash
        run: |
          if [ ! -f bundle/version.txt ]; then
            echo "No release bundle, so the build had nothing to release. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat bundle/version.txt)" >> "$GITHUB_OUTPUT"
            echo "sha=$(cat bundle/commit.txt)" >> "$GITHUB_OUTPUT"
          fi

      # v<date>, or v<date>.2, .3, ... when a manual same-day build already took it (see the
      # header).
      - name: Compute a free tag
        id: tag
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('fs').readFileSync('bundle/version.txt', 'utf8').trim();
            const base = `v${version}`;
            let tag = base, n = 1;
            while (true) {
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                n += 1; tag = `${base}.${n}`;   // taken -> try next suffix
              } catch (e) {
                if (e.status === 404) break;     // free
                throw e;
              }
            }
            core.setOutput('tag', tag);

      - name: Create the GitHub Release
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.gate.outputs.sha }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          # The release notes are the base changelog. GitHub caps a release body at 125,000
          # characters and rejects the whole create with a 422 past that, so we inline the
          # changelog only up to a budget well under it. The full text always ships as the
          # changelog-base.txt asset. A daily diff is nowhere near the cap, but a build against
          # a months-old baseline, or a sweeping mechanical change, can be.
          #
          # We cut on whole lines, because cutting at a byte offset can split a UTF-8 character
          # and hand the API an invalid body.
          {
            echo "winapp2.ini \`${VERSION}\` automated build."
            echo "below is the base flavor's semantic changelog (changelog-base.txt)"
            echo "all flavors and their changelogs are attached at the bottom alongside a copy of the latest winapp2ool"            
            echo
            echo '```'
            if [ -f bundle/changelog-base.txt ]; then
              awk -v budget=100000 '
                { total += length($0) + 1
                  if (total > budget) { truncated = 1; exit }
                  print }
                END { if (truncated) printf "\n... changelog truncated here; see the attached changelog-base.txt for the full text.\n" }
              ' bundle/changelog-base.txt
            else
              echo '(no base changelog produced)'
            fi
            echo '```'
          } > notes.md

          # Attach every asset except the internal metadata files.
          mapfile -t assets < <(find bundle -type f ! -name version.txt ! -name commit.txt | sort)

          gh release create "$TAG" "${assets[@]}" \
            --title "winapp2.ini $TAG" \
            --notes-file notes.md \
            --target "$SHA"
