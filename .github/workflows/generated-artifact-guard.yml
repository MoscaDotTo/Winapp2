# Generated-artifact guard: fail when a change edits a build output without editing the
# source that produces it.
#
# The mistake it catches: you edit Assembler/Generated/EntryBuilder/#.ini when you meant
# Assembler/Sources/EntryBuilder/#.ini. Nothing complains, and the file on disk says what you
# wanted, until the daily build regenerates Generated/ from the untouched source and your edit
# is gone. This turns that into a red X.
#
# The two workflows that build things don't catch it:
#   * artifact-drift.yml's -Verify would, but it only runs when the exe changes, or after the
#     daily build has already overwritten the edit.
#   * pr-verify.yml builds the PR merged into master and reports the output delta, but it
#     regenerates Generated/ in place first, so the hand-edit is gone before anything looks.
# This guard runs no build. It only checks that the changed paths make sense together.
#
# It's read-only, posts no comments and commits nothing, and it's safe on fork PRs: read-only
# token, no secrets, and nothing runs but `git diff --name-only` and the classifier script.
# That script comes from the PR's merge commit, so a PR can edit it, but maintainer-paths-guard.yml
# fails any fork or non-member PR that touches .github/.
name: generated artifact guard

on:
  # Unlike artifact-drift.yml, this is safe to gate PRs on: it only asks that the edit be in
  # the right file, which needs no tooling, and running a build can't satisfy it.
  pull_request:
    types: [opened, synchronize, reopened]

  # Push covers commits straight onto a feature branch or master, which no pull_request event
  # sees. The paths are the only files either rule looks at.
  #
  # No feedback loop: build-on-merge.yml commits these exact artifacts, but with the
  # GITHUB_TOKEN, and token pushes don't fire push events. The actor check on the job is a
  # backup in case that ever changes.
  push:
    paths:
      - 'Assembler/**'
      - 'Winapp2.ini'
      - 'diff.txt'
      - 'Non-CCleaner/**'
      - 'Releases/**'
      - '.github/workflows/generated-artifact-guard.yml'
      - '.github/scripts/check-generated-sources.sh'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-artifact-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    # Skip the build's own commits: they're output-only on purpose, which is exactly what
    # rule 1 forbids for people.
    if: github.actor != 'github-actions[bot]'

    steps:
      # Full history: the check diffs against the merge base, which needs both sides.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A fork PR's head commit lives in the fork. fetch-depth 0 pulls refs/pull/<n>/merge,
      # whose second parent is that head, so it's usually here already. We fetch it anyway,
      # like pr-verify.yml does, because a missing head object would fail the run.
      - name: Fetch PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.number }}/head:refs/remotes/pr/head" || true

      # The two refs to diff: the base branch tip and the PR head for a PR, the pushed range
      # for a push.
      - name: Resolve diff range
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          have() { git cat-file -e "$1^{commit}" 2>/dev/null; }

          case "$EVENT" in
            pull_request)
              # The head SHA is the merge ref's second parent, which the full-depth
              # clone already has.
              base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE"; head="$PUSH_AFTER"
              # A new branch reports before=000...0, and a force-push can report a commit
              # that's no longer reachable. We can't diff either, so fall back to the merge
              # base with the default branch, which asks what this branch adds.
              if [ "$base" = "0000000000000000000000000000000000000000" ] || ! have "$base"; then
                git fetch --no-tags origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
                base="origin/$DEFAULT_BRANCH"
              fi
              # A push straight to the default branch has no merge base to fall back on;
              # if base and head are the same commit there is nothing to compare.
              if [ "$(git rev-parse "$base")" = "$(git rev-parse "$head")" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              ;;
            *)
              base="origin/$DEFAULT_BRANCH"; head="$PUSH_AFTER"
              if [ "$(git rev-parse "$base")" = "$(git rev-parse "$head")" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              ;;
          esac

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Comparing $base...$head"

      # The escape hatch. Rule 1 can't tell a hand-edit from a deliberate regeneration (see
      # the script header), so the innocent case declares itself.
      #
      # We check every commit message in the range, not just the head commit, so a push of
      # several commits doesn't need the token on whichever one happens to be last. It's
      # checked here rather than in the script so the override shows in the log even on runs
      # that would have passed anyway.
      #
      # The PR title comes in through env and never gets interpolated into the script, since
      # on a fork PR it's attacker-controlled text. grep -F, no eval.
      #
      # Lowercased with `tr` rather than `grep -i`, because `grep -i` SIGABRTs on Git Bash's
      # GNU grep 3.0 (with or without -F). It would work in CI and be untestable on the
      # maintainer's machine.
      - name: Check for the override token
        id: skiptoken
        if: steps.range.outputs.skip != 'true'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -uo pipefail
          {
            printf '%s\n' "${PR_TITLE:-}"
            git log --format=%B "$BASE..$HEAD" -- 2>/dev/null
          } | tr '[:upper:]' '[:lower:]' \
            | grep -qFe '[regen]' -e '[skip-generated-check]' && {
            echo "Override token present; the guard will report but not fail this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          }
          exit 0

      - name: Are the changed paths coherent?
        if: steps.range.outputs.skip != 'true' && steps.skiptoken.outputs.skip != 'true'
        shell: bash
        run: |
          bash .github/scripts/check-generated-sources.sh \
            '${{ steps.range.outputs.base }}' '${{ steps.range.outputs.head }}'
