# PR verify, comment half. It runs on workflow_run after the untrusted "winapp2.ini PR verify"
# build finishes, in the base repo's context, so it can hold write permissions safely: it never
# checks out or runs PR code. It downloads the text report the build job left and posts or
# updates one sticky comment on the PR.
#
# Since this job can write and the report came from untrusted code, every byte of the report is
# data, and the PR number isn't taken on trust (see the github-script step).
name: winapp2.ini PR verify comment

on:
  workflow_run:
    workflows: ["winapp2.ini PR verify"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Download report bundle from the build run
        uses: actions/download-artifact@v4
        with:
          name: pr-verify-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- winapp2-pr-verify -->';

            // Written by the untrusted build job; we only ever read it as text.
            let body, fileNumber;
            try {
              body = fs.readFileSync('report/report.md', 'utf8');
              fileNumber = fs.readFileSync('report/pr-number.txt', 'utf8').trim();
            } catch (e) {
              core.info('No report bundle to comment on; nothing to do.');
              return;
            }

            const run = context.payload.workflow_run;

            // Same-repo runs carry the PR association, and we trust that. Fork runs
            // don't, so we fall back to the number the build job wrote, but only once
            // that PR's head SHA matches the commit this run built, so a PR can't
            // aim the report at someone else's.
            let prNumber = null;
            if (run.pull_requests && run.pull_requests.length > 0) {
              prNumber = run.pull_requests[0].number;
            } else {
              const candidate = parseInt(fileNumber, 10);
              if (!Number.isInteger(candidate)) {
                core.setFailed(`report pr-number.txt is not a valid number: "${fileNumber}"`);
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: candidate,
              });
              if (pr.head.sha !== run.head_sha) {
                core.setFailed(
                  `refusing to comment: PR #${candidate} head ${pr.head.sha} ` +
                  `does not match the built commit ${run.head_sha}`);
                return;
              }
              prNumber = candidate;
            }

            const fullBody = `${marker}\n${body}`;

            // Update our sticky comment if there is one, otherwise create it. We read
            // every page, since a busy PR can push ours past the first 30. Only a comment this
            // workflow wrote counts: anyone can paste the marker into their own comment, and
            // matching that would have us overwrite a contributor's words with the report.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]' &&
              c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body: fullBody,
              });
            }
            core.info(`Posted PR-verify result to #${prNumber}.`);
