# Artifact drift check: does Assembler/Generated still match what the generators produce
# from their sources, and does the committed winapp2ool.exe still produce it byte for byte?
#
# This is the only workflow that runs `build winapp2.ps1 -Verify`. A full build (pr-verify.yml,
# build-on-merge.yml) regenerates Generated in place before combining, so it never notices
# drift: build-on-merge just repairs it and commits the repair. -Verify regenerates into a
# scratch folder and byte-compares instead, so a change in generator output nobody asked for
# shows up as a red X rather than a surprise line in tomorrow's changelog.
#
# It doesn't commit, tag, publish or diff branches, and it isn't a PR gate. A PR that edits an
# EntryBuilder source without regenerating Generated is a fine PR (pr-verify.yml regenerates and
# reports the real diff), and drift-checking PRs would mean asking contributors to run winapp2ool.
#
# It fires on one path only: the committed exe. That's the only build input whose change should
# leave the output byte-identical. Everything else under Assembler\ (Sources\EntryBuilder\,
# Sources\UWPBuilder\, Sources\BrowserBuilder\, and Sources\Scaffolds\, which both builders read
# through -3d/-4d) is a source, and editing a source is supposed to change the output. Generated
# stays stale from that push until build-on-merge.yml's next run commits the regeneration, and
# despite its name that workflow is a 06:00 cron, so the window can be up to 24 hours. When we
# watched the source paths too, every source push and every source-only PR merge (a UI merge
# fires a push on master) went red, which was correct and told us nothing. Hand-edits of
# Generated\ itself get caught sooner and cheaper by generated-artifact-guard.yml, which runs
# no build.
#
# It runs the committed winapp2ool.exe (staged into Assembler\ by the Release post-build step)
# instead of compiling from source. Since the 4.8 retarget that's a choice rather than a
# constraint, and it's still the right one here: Generated was produced by the shipped binary,
# and the question is whether that binary still reproduces it. It can't tell you the source
# compiles or that the exe matches it. exe-parity.yml checks that.
name: winapp2.ini artifact drift check

on:
  # Manual button (shows up once this file is on the default branch).
  workflow_dispatch:
  # pull_request and schedule triggers don't fire on feature branches, so push is the only CI
  # a branch gets before it merges. An exe push asks whether a new build of the tool still
  # generates identical output from unchanged sources. Red means the rebuild changed generator
  # behavior, either on purpose (regenerate Generated and commit it with [regen]) or by
  # accident (find out why before it reaches a release).
  #
  # No feedback loop: build-on-merge.yml commits Assembler/Generated with the GITHUB_TOKEN, and
  # token pushes don't fire push events. It never commits the exe anyway, only copies it into
  # the release bundle.
  push:
    paths:
      - 'Assembler/winapp2ool.exe'
      - '.github/workflows/artifact-drift.yml'
  # Post-build check on master. Right after build-on-merge commits its regeneration, committed
  # Generated has to equal regenerate(sources). It's the one moment drift is never expected, so
  # red here actually means something: nondeterministic generator output, an artifact the build
  # writes that the commit step's path list doesn't stage, or a push racing the build.
  workflow_run:
    workflows: ["winapp2.ini build on merge"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: artifact-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    # A failed build leaves a half-written tree, and drift reported against that tells us
    # nothing. Push and manual runs always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run reports the commit the build started from, not the one it committed.
          # Checking that out would verify the pre-rebuild tree and fail every time. An empty
          # string keeps the normal behavior for push and dispatch.
          ref: ${{ github.event_name == 'workflow_run' && 'master' || '' }}

      # -Verify regenerates every artifact into Assembler/Verify and byte-compares it against
      # the committed Assembler/Generated, exiting 1 on drift and keeping the scratch folder.
      # We run it as a child process so the script's `exit N` lands in $LASTEXITCODE.
      - name: Characteristic test (build winapp2.ps1 -Verify)
        shell: pwsh
        working-directory: Assembler
        run: |
          if (-not (Test-Path 'winapp2ool.exe')) { throw 'winapp2ool.exe missing from Assembler; a Release build stages it there, and it should be committed' }
          pwsh -File './build winapp2.ps1' -Verify
          exit $LASTEXITCODE

      # Silent mode writes winapp2ool.log when it exits nonzero.
      - name: Upload drift scratch + log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-drift-failure
          path: |
            Assembler/Verify/**
            Assembler/winapp2ool.log
          if-no-files-found: ignore
          retention-days: 7
