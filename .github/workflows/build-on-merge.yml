# Daily build: regenerate winapp2.ini, every flavor and their changelogs from master's sources
# and commit them back to master, so the published files never drift from their sources.
# release.yml then cuts a GitHub Release from what this produced.
#
# Why daily and not on every push: the build computes each changelog against the currently
# committed winapp2.ini, so a changelog only covers what changed since the last commit. If we
# rebuilt on every source push, several builds in one day would each commit and move that
# baseline, and the day's release would only show the last one's diff. Building at most once a
# day keeps commits and releases 1:1, so each release's changelog is the whole diff from the one
# before it. winapp2.ini rarely changes more than once a day anyway, and the workflow_dispatch
# button covers the days it does.
#
# No loop: there's no push trigger, so this workflow's own commit to master can't retrigger it.
# The commit doesn't fire release.yml through a push either. release.yml chains off this
# workflow finishing (workflow_run).
#
# Like artifact-drift.yml, it runs the committed Assembler\winapp2ool.exe instead of compiling.
name: winapp2.ini build on merge

on:
  # If master's sources haven't changed since the last build, nothing gets staged and the run
  # neither commits nor releases.
  #
  # That took more than an identical rebuild: every lint pass restamps "; Version: <today>"
  # through -usedate, so an untouched rebuild still differs from the published file on that one
  # line, and that used to commit and release an empty changelog every day (v260729 was one).
  # build winapp2.ps1 now compares each built artifact to the one it would replace, ignoring the
  # stamp, and doesn't republish when nothing else moved. An unchanged day leaves the tree alone,
  # and the stamp stays on the date of the last real content change.
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (11PM MST)
  # Out-of-cycle build. A second build on a day that already released gets its own v<date>.2
  # release carrying just the change since the earlier build (see release.yml).
  workflow_dispatch:

# Write access is fine here, unlike pr-verify.yml: this only ever runs on merged master content.
permissions:
  contents: write

# One build at a time, and never cancel one: it may be partway through pushing to master.
concurrency:
  group: winapp2-build-on-merge
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        # persist-credentials defaults to true, which leaves the GITHUB_TOKEN set up for the
        # commit step's push.

      - name: Build winapp2.ini (full, all flavors)
        shell: pwsh
        working-directory: Assembler
        run: |
          if (-not (Test-Path 'winapp2ool.exe')) { throw 'winapp2ool.exe missing from Assembler; a Release build stages it there, and it should be committed' }
          pwsh -File './build winapp2.ps1'
          exit $LASTEXITCODE

      - name: Upload winapp2ool log on build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-on-merge-log
          path: Assembler/winapp2ool.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit regenerated artifacts and stage the release bundle
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # git diff --cached --quiet exits 1 when there are staged changes, which we expect,
          # so PS 7.3+ mustn't throw on it.
          $PSNativeCommandUseErrorActionPreference = $false

          # The release file lists (Releases/<asset>) and the bundle staging, shared with
          # release.yml's manual recovery path.
          . ./.github/scripts/release-assets.ps1

          # Only the tracked build outputs, never the log or scratch. Every path must exist or be
          # tracked: one unmatched pathspec makes `git add` stage nothing, which would read as
          # "no changes". The paths after $ReleaseFiles are the old copies build winapp2.ps1
          # still writes during the deprecation window.
          $outputs = @(
            'Assembler/Generated'
            $ReleaseFiles
            'Winapp2.ini'; 'diff.txt'
            'Non-CCleaner/Winapp2.ini'; 'Non-CCleaner/diff.txt'
            'Non-CCleaner/BleachBit/Winapp2.ini'; 'Non-CCleaner/BleachBit/diff.txt'
            'Non-CCleaner/CCleaner7/Winapp2.ini'; 'Non-CCleaner/CCleaner7/diff.txt'
            'Non-CCleaner/FluentCleaner/Winapp2.ini'; 'Non-CCleaner/FluentCleaner/diff.txt'
            'Non-CCleaner/Tron/Winapp2.ini'; 'Non-CCleaner/Tron/diff.txt'
            'Non-CCleaner/SystemNinja/Winapp2.rules'; 'Non-CCleaner/SystemNinja/diff.txt'
          )
          git add -- @outputs
          if ($LASTEXITCODE -ne 0) { throw "git add failed (exit $LASTEXITCODE); not committing or releasing" }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No artifact changes; nothing to commit or release.'
            "released=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          # Committing and releasing are separate decisions. A regenerated Generated/ or a rewritten
          # changelog still gets committed so the tree matches its sources, but we only release when
          # a file people download changed. build winapp2.ps1 already skips republishing an artifact
          # whose content didn't move, so getting here means Generated/ or a changelog changed on
          # its own. These are exact paths because -contains is an exact match, and the old
          # published paths carry the same bytes, so they aren't needed.
          $published = @($ReleaseDataFiles | ForEach-Object { "Releases/$_" })
          $staged = @(git diff --cached --name-only)
          $publishedChanged = @($staged | Where-Object { $published -contains $_ })

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ($publishedChanged.Count -eq 0) {
            Write-Host "No published artifact changed; committing the regenerated files without releasing."
            Write-Host ($staged -join "`n")
            git commit -m 'ci: sync regenerated winapp2.ini artifacts (no published changes)'
            if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
            git push origin HEAD:refs/heads/master
            if ($LASTEXITCODE -ne 0) { throw 'push to master failed; is the branch protected against the Actions token?' }
            "released=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Write-Host "Published artifacts changed:`n$($publishedChanged -join "`n")"

          # The version is the date stamp in a published file's header ("; Version: 260723"),
          # read from the files being released, not always from the base. The content gate leaves
          # an unchanged file's stamp on its last real change, so a flavor-only change (say,
          # Assembler/Sources/Flavors/Tron/ and nothing else) leaves Releases/winapp2.ini on the
          # previous date while Tron carries today's. Reading the base would tag today's release
          # with the previous release's date, and release.yml's free-tag loop would quietly
          # suffix it .2 instead of failing, so the mistake would ship looking intentional.
          #
          # The max across the changed files is today's stamp whenever anything was rebuilt.
          $version = Get-ReleaseVersion -Paths $publishedChanged

          git commit -m "ci: rebuild winapp2.ini artifacts (v$version)"
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:refs/heads/master
          if ($LASTEXITCODE -ne 0) { throw 'push to master failed; is the branch protected against the Actions token?' }
          $sha = (git rev-parse HEAD).Trim()

          # The 14 Releases files under their own names, plus winapp2ool.exe.
          New-ReleaseBundle -Destination (Join-Path $env:RUNNER_TEMP 'release-bundle') -Version $version -Sha $sha

          "released=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Committed rebuild v$version ($sha); staged release bundle."

      # Only uploaded when a published file changed. release.yml reads a missing bundle as
      # nothing to release.
      - name: Upload release bundle
        if: steps.commit.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle/**
          if-no-files-found: error
          retention-days: 7
