# Binary parity: is the committed Assembler\winapp2ool.exe still built from the committed source?
#
# Assembler\winapp2ool.exe is a tracked binary that the Release post-build step refreshes, and
# nothing used to check it against the source beside it. Rebuild locally, forget to commit the
# exe, push only the source, and the daily build keeps generating with the old tool with no red
# X anywhere, publishing output from code that isn't in the repo.
#
# We compare behavior, not bytes. Recompiling identical source gives a different binary (new
# MVID and timestamps), so comparing the exes would fail every run. Running both over the same
# sources and diffing what they generate asks whether the shipped tool still does what the
# source says.
#
# artifact-drift.yml's header used to claim this question, but -Verify compares committed
# Generated against regenerated Generated, so a tool change and an unregenerated source edit
# give the same answer. Holding the sources fixed and changing only the exe tells them apart.
#
# The runner could only build the projects after c495167e retargeted them to .NET 4.8.
name: winapp2ool binary parity

on:
  workflow_dispatch:
  # Runs when the binary changes, or the source it should have been built from.
  push:
    paths:
      - 'Assembler/winapp2ool.exe'
      - 'winapp2ool/**'
      - '!winapp2ool/**.md'
      - '!winapp2ool/**/readme.md'
      - '.github/workflows/exe-parity.yml'

permissions:
  contents: read

concurrency:
  group: exe-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This has to run before msbuild. The Release PostBuildEvent does
      # `copy /Y "$(TargetPath)" "..\Assembler\winapp2ool.exe"`, so compiling first would
      # overwrite the exe we're measuring and the comparison would pass by definition. The
      # build step blanks PostBuildEvent too, but generating first means we don't depend on
      # that one -p: flag.
      - name: Generate with the COMMITTED exe
        shell: pwsh
        working-directory: Assembler
        run: |
          if (-not (Test-Path 'winapp2ool.exe')) { throw 'winapp2ool.exe missing from Assembler; a Release build stages it there, and it should be committed' }
          pwsh -File './build winapp2.ps1' -GenerateTo '\Parity\Committed'
          exit $LASTEXITCODE

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The project's EnsureNuGetPackageBuildImports guard fails the build on any missing
      # analyzer package, so a bad restore would otherwise show up later as a confusing
      # build error.
      - name: Restore packages
        shell: pwsh
        run: |
          msbuild winapp2ool\winapp2ool.sln -t:restore -p:RestorePackagesConfig=true /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'package restore failed' }

      # /p:PostBuildEvent= skips the copy into Assembler\, the version.txt rewrite and the
      # signing. Belt to the ordering's suspenders (see the generate step above).
      - name: Build winapp2ool from source
        shell: pwsh
        run: |
          msbuild winapp2ool\winapp2ool.vbproj /p:Configuration=Release /p:PostBuildEvent= /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'source build failed' }
          $built = 'winapp2ool\bin\Release\winapp2ool.exe'
          if (-not (Test-Path $built)) { throw "build reported success but produced no exe at $built" }

      # The fresh build can stay in bin\Release: winapp2ool resolves a leading backslash in
      # -1d/-2d/-3d/-4d against the working directory, not its own folder (CliArgSpec.vb
      # ApplyDirArg), and working-directory pins that to Assembler.
      - name: Generate with the SOURCE-built exe
        shell: pwsh
        working-directory: Assembler
        run: |
          pwsh -File './build winapp2.ps1' -GenerateTo '\Parity\Source' -ToolPath '..\winapp2ool\bin\Release\winapp2ool.exe'
          exit $LASTEXITCODE

      - name: Compare the two generated trees
        shell: pwsh
        working-directory: Assembler
        run: |
          $committed = (Resolve-Path 'Parity\Committed').Path
          $source    = (Resolve-Path 'Parity\Source').Path
          $drift = @()

          foreach ($f in Get-ChildItem $committed -Filter '*.ini' -Recurse -File) {
            $rel = $f.FullName.Substring($committed.Length + 1)
            $counterpart = Join-Path $source $rel
            if (-not (Test-Path $counterpart)) {
              $drift += "only the committed exe produces: $rel"
              continue
            }
            if ((Get-FileHash $f.FullName).Hash -ne (Get-FileHash $counterpart).Hash) {
              $drift += "different content: $rel"
            }
          }
          foreach ($f in Get-ChildItem $source -Filter '*.ini' -Recurse -File) {
            $rel = $f.FullName.Substring($source.Length + 1)
            if (-not (Test-Path (Join-Path $committed $rel))) {
              $drift += "only the source-built exe produces: $rel"
            }
          }

          if ($drift.Count -gt 0) {
            Write-Host "::error::The committed winapp2ool.exe does not match the committed source"
            $drift | ForEach-Object { Write-Host "  $_" }
            Write-Host ''
            Write-Host 'Rebuild winapp2ool in Release and commit Assembler/winapp2ool.exe.'
            Write-Host 'The Release post-build step stages it there automatically.'
            exit 1
          }

          Write-Host 'Committed exe and source-built exe generate identical artifacts.'

      - name: Upload both trees on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exe-parity-failure
          path: |
            Assembler/Parity/**
            Assembler/winapp2ool.log
          if-no-files-found: ignore
          retention-days: 7
